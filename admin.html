<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GK Quiz Master - Admin</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    padding: 30px 20px;
}

.container {

    width: 100%;

    max-width: 1250px;

    margin: auto;

}

.header {

    background: white;

    padding: 25px 30px;

    border-radius: 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.15);

}

.header h1 {

    margin: 0;

    color: #667eea;

}

.header p {

    margin: 5px 0 0;

    color: #777;

}

.logout {

    background: #dc3545;

    color: white;

    border: none;

    padding: 12px 20px;

    border-radius: 10px;

    cursor: pointer;

    font-size: 15px;

}

.stats {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;

    margin-bottom: 20px;

}

.stat {

    background: white;

    padding: 25px;

    border-radius: 18px;

    text-align: center;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,0.12);

}

.stat h2 {

    font-size: 35px;

    margin: 0 0 5px;

    color: #667eea;

}

.stat p {

    margin: 0;

    color: #777;

}

.panel {

    background: white;

    padding: 25px;

    border-radius: 20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.15);

}

.panel h2 {

    margin-top: 0;

}

.table-wrapper {

    overflow-x: auto;

}

table {

    width: 100%;

    border-collapse: collapse;

    min-width: 1000px;

}

th,
td {

    padding: 14px 10px;

    border-bottom:
        1px solid #eee;

    text-align: left;

}

th {

    background: #f5f6ff;

    color: #555;

}

.status {

    font-weight: bold;

}

.pending {

    color: #f39c12;

}

.approved {

    color: #28a745;

}

.denied {

    color: #dc3545;

}

.level {

    font-weight: bold;

}

.level-yes {

    color: #28a745;

}

.level-no {

    color: #999;

}

button.action {

    border: none;

    padding: 8px 11px;

    border-radius: 8px;

    cursor: pointer;

    color: white;

    margin: 2px;

}

.approve {

    background: #28a745;

}

.reject {

    background: #dc3545;

}

.level-btn {

    background: #667eea;

}

.delete {

    background: #555;

}

.empty {

    text-align: center;

    padding: 30px;

    color: #777;

}

.user-name {

    font-weight: bold;

    color: #333;

}

.user-email {

    font-size: 13px;

    color: #777;

}

@media(max-width:700px) {

    .header {

        flex-direction: column;

        gap: 15px;

        text-align: center;

    }

    .stats {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<div class="container">


    <div class="header">

        <div>

            <h1>
                👑 GK Quiz Master
            </h1>

            <p>
                Administrator Control Panel
            </p>

        </div>


        <button
            class="logout"
            onclick="logoutAdmin()"
        >
            Logout
        </button>

    </div>


    <div class="stats">


        <div class="stat">

            <h2 id="totalUsers">
                0
            </h2>

            <p>
                Total Users
            </p>

        </div>


        <div class="stat">

            <h2 id="pendingUsers">
                0
            </h2>

            <p>
                Pending Approval
            </p>

        </div>


        <div class="stat">

            <h2 id="approvedUsers">
                0
            </h2>

            <p>
                Approved Users
            </p>

        </div>

    </div>


    <div class="panel">

        <h2>
            👥 User Management
        </h2>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            User
                        </th>

                        <th>
                            Account
                        </th>

                        <th>
                            Level 3
                        </th>

                        <th>
                            Level 4
                        </th>

                        <th>
                            Level 5
                        </th>

                        <th>
                            Registered
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="userTable"
                >
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================================
   CHECK ADMIN
========================================= */

function checkAdmin() {

    if (
        localStorage.getItem(
            "adminLoggedIn"
        ) !== "true"
    ) {

        window.location.href =
            "login.html";

        return false;

    }

    return true;

}


if (!checkAdmin()) {

    throw new Error(
        "Admin access denied"
    );

}


/* =========================================
   USERS
========================================= */

function getUsers() {

    try {

        return JSON.parse(
            localStorage.getItem("users")
        ) || [];

    } catch {

        return [];

    }

}


function saveUsers(users) {

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

}


/* =========================================
   NORMALIZE USER
========================================= */

function normalizeUser(user) {

    if (!Array.isArray(user.levelAccess)) {

        user.levelAccess = [1, 2];

    }


    if (!user.levelAccess.includes(1)) {

        user.levelAccess.push(1);

    }


    if (!user.levelAccess.includes(2)) {

        user.levelAccess.push(2);

    }


    return user;

}


/* =========================================
   LOAD USERS
========================================= */

function loadUsers() {

    let users =
        getUsers()
        .map(normalizeUser);


    saveUsers(users);


    const table =
        document.getElementById(
            "userTable"
        );


    table.innerHTML = "";


    /* Statistics */

    const total =
        users.length;


    const pending =
        users.filter(
            user =>
                user.approved !== true
        ).length;


    const approved =
        users.filter(
            user =>
                user.approved === true
        ).length;


    document.getElementById(
        "totalUsers"
    ).innerText = total;


    document.getElementById(
        "pendingUsers"
    ).innerText = pending;


    document.getElementById(
        "approvedUsers"
    ).innerText = approved;


    if (users.length === 0) {

        table.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty"
                >

                    No registered users yet.

                </td>

            </tr>

        `;

        return;

    }


    users.forEach(
        (user, index) => {

            const row =
                document.createElement(
                    "tr"
                );


            const access =
                user.levelAccess || [1,2];


            const accountStatus =
                user.approved === true;


            row.innerHTML = `

                <td>

                    <div class="user-name">

                        ${escapeHTML(
                            user.name ||
                            "Unknown User"
                        )}

                    </div>

                    <div class="user-email">

                        ${escapeHTML(
                            user.email ||
                            ""
                        )}

                    </div>

                </td>


                <td>

                    ${
                        accountStatus

                        ?

                        `
                        <span
                            class="status approved"
                        >
                            ✓ Approved
                        </span>
                        `

                        :

                        `
                        <span
                            class="status pending"
                        >
                            ⏳ Pending
                        </span>
                        `
                    }

                </td>


                <td>

                    <span
                        class="level ${
                            access.includes(3)
                            ? "level-yes"
                            : "level-no"
                        }"
                    >

                        ${
                            access.includes(3)
                            ? "✓ Granted"
                            : "✕ No Access"
                        }

                    </span>

                </td>


                <td>

                    <span
                        class="level ${
                            access.includes(4)
                            ? "level-yes"
                            : "level-no"
                        }"
                    >

                        ${
                            access.includes(4)
                            ? "✓ Granted"
                            : "✕ No Access"
                        }

                    </span>

                </td>


                <td>

                    <span
                        class="level ${
                            access.includes(5)
                            ? "level-yes"
                            : "level-no"
                        }"
                    >

                        ${
                            access.includes(5)
                            ? "✓ Granted"
                            : "✕ No Access"
                        }

                    </span>

                </td>


                <td>

                    ${escapeHTML(
                        user.createdAt ||
                        "Unknown"
                    )}

                </td>


                <td>


                    ${
                        accountStatus

                        ?

                        `
                        <button
                            class="action reject"
                            onclick="rejectUser(${index})"
                        >
                            Reject
                        </button>
                        `

                        :

                        `
                        <button
                            class="action approve"
                            onclick="approveUser(${index})"
                        >
                            ✓ Approve
                        </button>
                        `
                    }


                    <button
                        class="action level-btn"
                        onclick="toggleLevel(${index}, 3)"
                    >

                        L3

                    </button>


                    <button
                        class="action level-btn"
                        onclick="toggleLevel(${index}, 4)"
                    >

                        L4

                    </button>


                    <button
                        class="action level-btn"
                        onclick="toggleLevel(${index}, 5)"
                    >

                        L5

                    </button>


                    <button
                        class="action delete"
                        onclick="deleteUser(${index})"
                    >

                        Delete

                    </button>


                </td>

            `;


            table.appendChild(row);

        }
    );

}


/* =========================================
   APPROVE
========================================= */

function approveUser(index) {

    const users =
        getUsers();


    if (!users[index]) {
        return;
    }


    users[index] =
        normalizeUser(
            users[index]
        );


    users[index].approved =
        true;


    saveUsers(users);


    alert(
        "✅ Account approved successfully!"
    );


    loadUsers();

}


/* =========================================
   REJECT
========================================= */

function rejectUser(index) {

    const users =
        getUsers();


    if (!users[index]) {
        return;
    }


    users[index].approved =
        false;


    saveUsers(users);


    alert(
        "❌ Account approval removed."
    );


    loadUsers();

}


/* =========================================
   LEVEL ACCESS
========================================= */

function toggleLevel(index, level) {

    const users =
        getUsers();


    if (!users[index]) {
        return;
    }


    users[index] =
        normalizeUser(
            users[index]
        );


    let access =
        users[index].levelAccess;


    if (access.includes(level)) {

        /* Remove access */

        access =
            access.filter(
                item =>
                    item !== level
            );

    } else {

        /* Grant access */

        access.push(level);

    }


    access.sort(
        (a,b) => a-b
    );


    users[index].levelAccess =
        access;


    saveUsers(users);


    loadUsers();

}


/* =========================================
   DELETE
========================================= */

function deleteUser(index) {

    const users =
        getUsers();


    if (!users[index]) {
        return;
    }


    const user =
        users[index];


    const confirmDelete =
        confirm(
            "Delete account for " +
            (user.name ||
             user.email) +
            "?"
        );


    if (!confirmDelete) {
        return;
    }


    users.splice(
        index,
        1
    );


    saveUsers(users);


    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );


    if (
        currentUser &&
        currentUser.email ===
        user.email
    ) {

        localStorage.removeItem(
            "currentUser"
        );

    }


    loadUsers();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   LOGOUT
========================================= */

function logoutAdmin() {

    localStorage.removeItem(
        "adminLoggedIn"
    );


    window.location.href =
        "login.html";

}


/* =========================================
   LOAD
========================================= */

loadUsers();

</script>

</body>

</html>
