<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GK Quiz Master - Admin</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;

    background:
    linear-gradient(135deg, #667eea, #764ba2);

    padding: 25px 15px;
}

.container {
    width: 100%;
    max-width: 1100px;

    margin: auto;
}


/* HEADER */

.header {

    background: white;

    border-radius: 20px;

    padding: 22px 25px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;
}

.header h1 {
    margin: 0;

    color: #333;
}

.header p {
    margin: 5px 0 0;

    color: #777;
}

.logout {

    border: none;

    background: #dc3545;

    color: white;

    padding: 11px 18px;

    border-radius: 9px;

    cursor: pointer;

    font-weight: bold;
}


/* STATS */

.stats {

    display: grid;

    grid-template-columns:
    repeat(3, 1fr);

    gap: 15px;

    margin-bottom: 20px;
}

.stat {

    background: white;

    border-radius: 16px;

    padding: 18px;

    text-align: center;
}

.stat-icon {
    font-size: 30px;
}

.stat-number {

    font-size: 30px;

    font-weight: bold;

    margin: 5px 0;
}

.stat-label {
    color: #777;
}


/* MAIN */

.users-box {

    background: white;

    border-radius: 20px;

    padding: 25px;
}


/* TOOLBAR */

.toolbar {

    display: flex;

    gap: 10px;

    margin-bottom: 20px;

    flex-wrap: wrap;
}

.search {

    flex: 1;

    min-width: 220px;

    padding: 13px;

    border: 2px solid #ddd;

    border-radius: 10px;

    font-size: 16px;

    outline: none;
}

.search:focus {
    border-color: #667eea;
}

.filter {

    padding: 13px;

    border: 2px solid #ddd;

    border-radius: 10px;

    font-size: 15px;

    background: white;
}


/* USER */

.user {

    border: 1px solid #ddd;

    border-radius: 15px;

    padding: 18px;

    margin-bottom: 12px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;
}

.user-info {
    flex: 1;
}

.user-info h3 {

    margin: 0 0 5px;

    color: #333;
}

.user-info p {

    margin: 4px 0;

    color: #777;

    font-size: 14px;
}

.date {

    font-size: 13px;

    color: #999;
}


/* BADGES */

.badge {

    display: inline-block;

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

    margin-top: 5px;
}

.pending {

    background: #fff3cd;

    color: #856404;
}

.approved {

    background: #d4edda;

    color: #155724;
}


/* ACCESS */

.access {

    margin-top: 8px;

    font-size: 13px;

    font-weight: bold;
}


/* BUTTONS */

.actions {

    display: flex;

    gap: 7px;

    flex-wrap: wrap;

    justify-content: flex-end;
}

.actions button {

    border: none;

    padding: 10px 13px;

    border-radius: 8px;

    color: white;

    cursor: pointer;

    font-weight: bold;
}

.approve {
    background: #28a745;
}

.reject {
    background: #dc3545;
}

.revoke {
    background: #f0ad4e;
}


/* EMPTY */

.empty {

    text-align: center;

    padding: 45px;

    color: #777;
}


/* MOBILE */

@media(max-width:700px) {

    .header {

        flex-direction: column;

        align-items: flex-start;

        gap: 15px;
    }

    .stats {

        grid-template-columns: 1fr;
    }

    .user {

        flex-direction: column;

        align-items: flex-start;
    }

    .actions {

        justify-content: flex-start;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

    <div>

        <h1>
            👨‍💼 Admin Dashboard
        </h1>

        <p>
            GK Quiz Master User Management
        </p>

    </div>


    <button
    class="logout"
    onclick="logout()">

        Logout

    </button>

</div>



<!-- STATS -->

<div class="stats">


    <div class="stat">

        <div class="stat-icon">
            👥
        </div>

        <div
        class="stat-number"
        id="totalUsers">
            0
        </div>

        <div class="stat-label">
            Total Users
        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">
            ⏳
        </div>

        <div
        class="stat-number"
        id="pendingUsers">
            0
        </div>

        <div class="stat-label">
            Pending Approval
        </div>

    </div>


    <div class="stat">

        <div class="stat-icon">
            ✅
        </div>

        <div
        class="stat-number"
        id="approvedUsers">
            0
        </div>

        <div class="stat-label">
            Approved Users
        </div>

    </div>

</div>



<!-- USERS -->

<div class="users-box">


    <h2>
        👥 User Management
    </h2>


    <!-- TOOLBAR -->

    <div class="toolbar">


        <input
        class="search"
        id="search"
        type="text"
        placeholder="🔍 Search by name or email..."
        oninput="displayUsers()">


        <select
        class="filter"
        id="filter"
        onchange="displayUsers()">

            <option value="all">
                All Users
            </option>

            <option value="pending">
                Pending
            </option>

            <option value="approved">
                Approved
            </option>

        </select>


    </div>


    <div id="userList"></div>


</div>


</div>



<script>


/* =========================
   ADMIN
========================= */

const ADMIN_EMAIL =
    "admin@gkquiz.com";


function checkAdmin() {


    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );


    if (
        !currentUser ||
        currentUser.email !==
        ADMIN_EMAIL
    ) {

        alert(
            "⛔ Admin access required."
        );

        window.location.href =
            "login.html";

        return false;

    }


    return true;

}


/* =========================
   GET USERS
========================= */

function getUsers() {

    return JSON.parse(
        localStorage.getItem(
            "users"
        )
    ) || [];

}


/* =========================
   DISPLAY USERS
========================= */

function displayUsers() {


    const users =
        getUsers();


    const search =
        document.getElementById(
            "search"
        )
        .value
        .toLowerCase()
        .trim();


    const filter =
        document.getElementById(
            "filter"
        )
        .value;


    let filtered =
        users.filter(
            function(user) {


                const matchesSearch =

                    user.name
                    .toLowerCase()
                    .includes(search)

                    ||

                    user.email
                    .toLowerCase()
                    .includes(search);


                let matchesFilter =
                    true;


                if (
                    filter ===
                    "pending"
                ) {

                    matchesFilter =
                        !user.approved;

                }


                if (
                    filter ===
                    "approved"
                ) {

                    matchesFilter =
                        user.approved;

                }


                return (
                    matchesSearch &&
                    matchesFilter
                );

            }
        );


    const list =
        document.getElementById(
            "userList"
        );


    list.innerHTML = "";


    if (
        filtered.length === 0
    ) {

        list.innerHTML =

            `
            <div class="empty">

                No users found.

            </div>
            `;

        updateStats(users);

        return;

    }


    /* Newest users first */

    filtered.sort(
        function(a, b) {

            return (
                b.id - a.id
            );

        }
    );


    filtered.forEach(
        function(user) {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "user";


            const status =
                user.approved
                ? "Approved"
                : "Pending";


            const badgeClass =
                user.approved
                ? "approved"
                : "pending";


            const access =
                user.approved
                ? "🔓 Levels 1–5"
                : "🔒 Levels 1–2 only";


            let buttons = "";


            if (
                user.approved
            ) {

                buttons =

                    `
                    <button
                    class="revoke"
                    onclick="revokeUser(${user.id})">

                        🔒 Revoke

                    </button>
                    `;

            } else {

                buttons =

                    `
                    <button
                    class="approve"
                    onclick="approveUser(${user.id})">

                        ✓ Approve

                    </button>

                    <button
                    class="reject"
                    onclick="rejectUser(${user.id})">

                        ✕ Reject

                    </button>
                    `;

            }


            let registrationDate =
                "Unknown";


            if (
                user.createdAt
            ) {

                registrationDate =
                    new Date(
                        user.createdAt
                    ).toLocaleString();

            }


            div.innerHTML =

                `
                <div class="user-info">

                    <h3>
                        ${escapeHTML(user.name)}
                    </h3>

                    <p>
                        📧
                        ${escapeHTML(user.email)}
                    </p>

                    <span
                    class="badge ${badgeClass}">

                        ${status}

                    </span>

                    <div class="access">

                        ${access}

                    </div>

                    <div class="date">

                        📅 Registered:
                        ${registrationDate}

                    </div>

                </div>


                <div class="actions">

                    ${buttons}

                </div>
                `;


            list.appendChild(div);

        }
    );


    updateStats(users);

}


/* =========================
   STATS
========================= */

function updateStats(users) {


    const total =
        users.length;


    const pending =
        users.filter(
            user =>
                !user.approved
        ).length;


    const approved =
        users.filter(
            user =>
                user.approved
        ).length;


    document.getElementById(
        "totalUsers"
    ).innerText =
        total;


    document.getElementById(
        "pendingUsers"
    ).innerText =
        pending;


    document.getElementById(
        "approvedUsers"
    ).innerText =
        approved;

}


/* =========================
   APPROVE
========================= */

function approveUser(id) {


    const users =
        getUsers();


    const user =
        users.find(
            user =>
                user.id === id
        );


    if (!user) return;


    user.approved =
        true;


    /*
       Approved user gets
       ALL Level 1–5 access.
    */

    user.levelAccess =
        [1, 2, 3, 4, 5];


    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );


    displayUsers();

}


/* =========================
   REVOKE
========================= */

function revokeUser(id) {


    const confirmRevoke =
        confirm(
            "Revoke Level 3–5 access from this user?"
        );


    if (!confirmRevoke)
        return;


    const users =
        getUsers();


    const user =
        users.find(
            user =>
                user.id === id
        );


    if (!user) return;


    user.approved =
        false;


    user.levelAccess =
        [1, 2];


    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );


    displayUsers();

}


/* =========================
   REJECT
========================= */

function rejectUser(id) {


    const confirmReject =
        confirm(
            "Reject and remove this account?"
        );


    if (!confirmReject)
        return;


    let users =
        getUsers();


    users =
        users.filter(
            user =>
                user.id !== id
        );


    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );


    displayUsers();

}


/* =========================
   LOGOUT
========================= */

function logout() {


    localStorage.removeItem(
        "currentUser"
    );


    window.location.href =
        "login.html";

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================
   START
========================= */

if (checkAdmin()) {

    displayUsers();

}

</script>


</body>

</html>
