<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK Quiz Master - Admin</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 30px 20px;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

.header {
    background: white;
    padding: 25px 30px;
    border-radius: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.header h1 {
    margin: 0;
    color: #667eea;
}

.header p {
    margin: 5px 0 0;
    color: #777;
}

.logout {
    background: #dc3545;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    padding: 25px;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
}

.stat h2 {
    font-size: 35px;
    margin: 0 0 5px;
    color: #667eea;
}

.stat p {
    margin: 0;
    color: #777;
}

.panel {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.panel h2 {
    margin-top: 0;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 14px 10px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #f5f6ff;
    color: #555;
}

.status {
    font-weight: bold;
}

.pending {
    color: #f39c12;
}

.approved {
    color: #28a745;
}

.rejected {
    color: #dc3545;
}

button.action {
    border: none;
    padding: 8px 13px;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    margin: 2px;
}

.approve {
    background: #28a745;
}

.reject {
    background: #dc3545;
}

.delete {
    background: #555;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

@media(max-width:700px) {

    .header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .panel {
        overflow-x: auto;
    }

    table {
        min-width: 700px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <h1>👑 GK Quiz Master</h1>
            <p>Administrator Control Panel</p>
        </div>

        <button class="logout" onclick="logoutAdmin()">
            Logout
        </button>

    </div>


    <div class="stats">

        <div class="stat">
            <h2 id="totalUsers">0</h2>
            <p>Total Users</p>
        </div>

        <div class="stat">
            <h2 id="pendingUsers">0</h2>
            <p>Pending Approval</p>
        </div>

        <div class="stat">
            <h2 id="approvedUsers">0</h2>
            <p>Approved Users</p>
        </div>

    </div>


    <div class="panel">

        <h2>👥 User Management</h2>

        <table>

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Status</th>
                    <th>Registered</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="userTable">

            </tbody>

        </table>

    </div>

</div>


<script>

/* =========================================
   ADMIN ACCOUNT
========================================= */

const ADMIN_EMAIL = "admin@gkquiz.com";
const ADMIN_PASSWORD = "Admin@123";


/* =========================================
   CHECK ADMIN LOGIN
========================================= */

function checkAdmin() {

    const adminLoggedIn =
        localStorage.getItem("adminLoggedIn");

    if (adminLoggedIn !== "true") {

        window.location.href =
            "login.html";

        return false;
    }

    return true;
}


if (!checkAdmin()) {

    throw new Error("Admin access denied.");

}


/* =========================================
   GET USERS
========================================= */

function getUsers() {

    return JSON.parse(
        localStorage.getItem("users")
    ) || [];

}


/* =========================================
   SAVE USERS
========================================= */

function saveUsers(users) {

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

}


/* =========================================
   LOAD USERS
========================================= */

function loadUsers() {

    const users = getUsers();

    const table =
        document.getElementById("userTable");

    table.innerHTML = "";


    /* Statistics */

    const total =
        users.length;

    const pending =
        users.filter(
            user => user.approved !== true
        ).length;

    const approved =
        users.filter(
            user => user.approved === true
        ).length;


    document.getElementById(
        "totalUsers"
    ).innerText = total;

    document.getElementById(
        "pendingUsers"
    ).innerText = pending;

    document.getElementById(
        "approvedUsers"
    ).innerText = approved;


    if (users.length === 0) {

        table.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    No registered users yet.
                </td>
            </tr>
        `;

        return;
    }


    users.forEach(
        function(user, index) {

            const row =
                document.createElement("tr");


            let statusText;
            let statusClass;


            if (user.approved === true) {

                statusText =
                    "✓ Approved";

                statusClass =
                    "approved";

            } else {

                statusText =
                    "⏳ Pending";

                statusClass =
                    "pending";

            }


            const registered =
                user.createdAt ||
                "Unknown";


            row.innerHTML = `

                <td>
                    ${escapeHTML(user.name || "User")}
                </td>

                <td>
                    ${escapeHTML(user.email || "")}
                </td>

                <td class="status ${statusClass}">
                    ${statusText}
                </td>

                <td>
                    ${escapeHTML(registered)}
                </td>

                <td>

                    ${
                        user.approved === true

                        ?

                        `
                        <button
                            class="action reject"
                            onclick="rejectUser(${index})">
                            Reject
                        </button>
                        `

                        :

                        `
                        <button
                            class="action approve"
                            onclick="approveUser(${index})">
                            ✓ Approve
                        </button>
                        `
                    }

                    <button
                        class="action delete"
                        onclick="deleteUser(${index})">
                        Delete
                    </button>

                </td>

            `;


            table.appendChild(row);

        }
    );

}


/* =========================================
   APPROVE USER
========================================= */

function approveUser(index) {

    const users =
        getUsers();

    if (!users[index]) {
        return;
    }


    users[index].approved = true;

    saveUsers(users);

    alert(
        "✅ User approved successfully!"
    );

    loadUsers();

}


/* =========================================
   REJECT USER
========================================= */

function rejectUser(index) {

    const users =
        getUsers();

    if (!users[index]) {
        return;
    }


    users[index].approved = false;

    saveUsers(users);


    /*
       If this user is currently logged in,
       remove their current session.
    */

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );


    if (
        currentUser &&
        currentUser.email ===
        users[index].email
    ) {

        localStorage.removeItem(
            "currentUser"
        );

    }


    alert(
        "User approval has been removed."
    );

    loadUsers();

}


/* =========================================
   DELETE USER
========================================= */

function deleteUser(index) {

    const users =
        getUsers();

    if (!users[index]) {
        return;
    }


    const name =
        users[index].name ||
        users[index].email;


    const confirmDelete =
        confirm(
            "Delete user " +
            name +
            "?"
        );


    if (!confirmDelete) {
        return;
    }


    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );


    if (
        currentUser &&
        currentUser.email ===
        users[index].email
    ) {

        localStorage.removeItem(
            "currentUser"
        );

    }


    users.splice(
        index,
        1
    );


    saveUsers(users);

    loadUsers();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================
   ADMIN LOGOUT
========================================= */

function logoutAdmin() {

    localStorage.removeItem(
        "adminLoggedIn"
    );

    window.location.href =
        "login.html";

}


/* =========================================
   LOAD
========================================= */

loadUsers();

</script>

</body>
</html>
