<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GK Quiz Master - Login</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
    linear-gradient(
        135deg,
        #667eea,
        #764ba2
    );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}


.login-box {

    width: 100%;

    max-width: 420px;

    background: white;

    padding: 35px;

    border-radius: 22px;

    box-shadow:
    0 15px 40px
    rgba(0,0,0,0.25);

}


.logo {

    text-align: center;

    font-size: 55px;

    margin-bottom: 5px;

}


h1 {

    text-align: center;

    margin: 5px 0;

    color: #333;

}


.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 30px;

}


label {

    display: block;

    font-weight: bold;

    margin-bottom: 7px;

    color: #444;

}


input {

    width: 100%;

    padding: 14px;

    margin-bottom: 18px;

    border: 2px solid #ddd;

    border-radius: 10px;

    font-size: 16px;

    outline: none;

}


input:focus {

    border-color: #667eea;

}


.login-btn {

    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background: #667eea;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}


.login-btn:hover {

    background: #5568d9;

}


.register {

    text-align: center;

    margin-top: 20px;

    color: #777;

}


.register a {

    color: #667eea;

    font-weight: bold;

    text-decoration: none;

}


.message {

    text-align: center;

    margin-top: 15px;

    font-weight: bold;

    min-height: 20px;

}


.back {

    display: block;

    text-align: center;

    margin-top: 20px;

    color: #777;

    text-decoration: none;

}


</style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        🧠
    </div>


    <h1>
        Welcome Back
    </h1>


    <div class="subtitle">
        GK Quiz Master
    </div>


    <form
    onsubmit="login(event)">


        <label>
            Email
        </label>


        <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required>


        <label>
            Password
        </label>


        <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required>


        <button
        type="submit"
        class="login-btn">

            🔐 Login

        </button>


    </form>


    <div
    class="message"
    id="message">
    </div>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Register
        </a>

    </div>


    <a
    href="index.html"
    class="back">

        ← Back to Home

    </a>


</div>



<script>

function login(event) {

    event.preventDefault();


    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    /*
       Temporary login system.
       We will connect this to
       the real database later.
    */


    const users =
        JSON.parse(
            localStorage.getItem(
                "users"
            )
        ) || [];


    const user =
        users.find(
            function(u) {

                return (
                    u.email === email &&
                    u.password === password
                );

            }
        );


    if (!user) {

        message.innerText =
            "❌ Incorrect email or password.";

        message.style.color =
            "#dc3545";

        return;

    }


    localStorage.setItem(
        "currentUser",
        JSON.stringify(user)
    );


    message.innerText =
        "✅ Login successful!";

    message.style.color =
        "#28a745";


    setTimeout(
        function() {

            window.location.href =
                "index.html";

        },
        700
    );

}

</script>


</body>

</html>
