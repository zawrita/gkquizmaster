<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GK Quiz Master - Login</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}

.login-box {

    width: 100%;

    max-width: 450px;

    background: white;

    padding: 35px;

    border-radius: 22px;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,0.2);

}

.logo {

    text-align: center;

    font-size: 40px;

}

h1 {

    text-align: center;

    margin-top: 0;

    color: #667eea;

}

.subtitle {

    text-align: center;

    color: #777;

    margin-bottom: 25px;

}

label {

    display: block;

    margin-bottom: 6px;

    font-weight: bold;

    color: #555;

}

input {

    width: 100%;

    padding: 14px;

    border: 2px solid #ddd;

    border-radius: 10px;

    margin-bottom: 15px;

    font-size: 16px;

    outline: none;

}

input:focus {

    border-color: #667eea;

}

.submit {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 10px;

    background: #667eea;

    color: white;

    font-size: 17px;

    cursor: pointer;

    font-weight: bold;

}

.submit:hover {

    background: #5568d9;

}

.admin-button {

    margin-top: 15px;

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 10px;

    background: #333;

    color: white;

    cursor: pointer;

}

.message {

    text-align: center;

    margin-top: 15px;

    min-height: 22px;

    font-weight: bold;

    line-height: 1.5;

}

.register {

    text-align: center;

    margin-top: 20px;

    color: #777;

}

.register a {

    color: #667eea;

    font-weight: bold;

    text-decoration: none;

}

.back {

    display: block;

    text-align: center;

    margin-top: 20px;

    color: #667eea;

    text-decoration: none;

}

.admin-info {

    background: #f8f9fa;

    border-radius: 10px;

    padding: 12px;

    margin-top: 15px;

    font-size: 13px;

    color: #666;

    text-align: center;

}

</style>

</head>

<body>


<div class="login-box">

    <div class="logo">
        🧠
    </div>

    <h1>
        GK Quiz Master
    </h1>

    <div class="subtitle">
        General Knowledge Challenge
    </div>


    <form onsubmit="loginUser(event)">

        <label>
            Email
        </label>

        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
        >


        <button
            type="submit"
            class="submit"
        >
            🔐 Login
        </button>

    </form>


    <button
        class="admin-button"
        onclick="adminLogin()"
    >
        👑 Admin Login
    </button>


    <div
        class="message"
        id="message"
    ></div>


    <div class="register">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


    <div class="admin-info">

        👑 Admin:
        <strong>admin@gkquiz.com</strong>

    </div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Home
    </a>

</div>


<script>

/* =========================================
   ADMIN
========================================= */

const ADMIN_EMAIL =
    "admin@gkquiz.com";

const ADMIN_PASSWORD =
    "Admin@123";


/* =========================================
   GET USERS
========================================= */

function getUsers() {

    try {

        return JSON.parse(
            localStorage.getItem("users")
        ) || [];

    } catch {

        return [];

    }

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text, color) {

    const message =
        document.getElementById("message");

    message.innerText = text;

    message.style.color = color;

}


/* =========================================
   LOGIN
========================================= */

function loginUser(event) {

    event.preventDefault();


    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    /* ADMIN */

    if (
        email === ADMIN_EMAIL &&
        password === ADMIN_PASSWORD
    ) {

        localStorage.setItem(
            "adminLoggedIn",
            "true"
        );

        localStorage.removeItem(
            "currentUser"
        );

        window.location.href =
            "admin.html";

        return;

    }


    /* USERS */

    const users =
        getUsers();


    const user =
        users.find(
            u =>
                String(u.email)
                .toLowerCase() === email &&
                u.password === password
        );


    if (!user) {

        showMessage(
            "❌ Incorrect email or password.",
            "#dc3545"
        );

        return;

    }


    /* Save complete current user */

    localStorage.setItem(
        "currentUser",
        JSON.stringify({
            id: user.id,
            name: user.name,
            email: user.email
        })
    );


    /* ACCOUNT APPROVAL */

    if (user.approved !== true) {

        showMessage(
            "⏳ Login successful, but your account is waiting for Admin approval.",
            "#f39c12"
        );

        return;

    }


    /* APPROVED */

    window.location.href =
        "index.html";

}


/* =========================================
   ADMIN LOGIN
========================================= */

function adminLogin() {

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim()
        .toLowerCase();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    if (
        email !== ADMIN_EMAIL ||
        password !== ADMIN_PASSWORD
    ) {

        showMessage(
            "❌ Enter the correct Admin email and password.",
            "#dc3545"
        );

        return;

    }


    localStorage.setItem(
        "adminLoggedIn",
        "true"
    );


    localStorage.removeItem(
        "currentUser"
    );


    window.location.href =
        "admin.html";

}

</script>

</body>

</html>
