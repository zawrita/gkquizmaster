<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Gemini ရာထူးဝင်ခွင့်သင်တန်း</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    padding: 30px 20px;
}

.container {

    width: 100%;

    max-width: 1000px;

    margin: auto;
}

.header {

    background: white;

    padding: 30px;

    border-radius: 22px;

    text-align: center;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,0.18);

    margin-bottom: 25px;
}

.logo {

    font-size: 50px;
}

.header h1 {

    margin: 5px 0;

    color: #667eea;

    font-size: 35px;
}

.header p {

    color: #777;

    margin: 5px 0 20px;
}

.user-area {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 10px;

    flex-wrap: wrap;
}

.user-name {

    color: #555;

    font-weight: bold;
}

.login-btn,
.logout-btn,
.admin-btn {

    border: none;

    padding: 10px 18px;

    border-radius: 9px;

    color: white;

    cursor: pointer;

    font-size: 14px;
}

.login-btn {

    background: #667eea;
}

.logout-btn {

    background: #dc3545;
}

.admin-btn {

    background: #333;
}

/* =========================
   LEVELS
========================= */

.levels {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;
}

.level {

    background: white;

    border-radius: 20px;

    padding: 25px;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,0.15);

    position: relative;

    transition: 0.2s;
}

.level:hover {

    transform:
        translateY(-4px);
}

.level-number {

    font-size: 14px;

    color: #667eea;

    font-weight: bold;
}

.level h2 {

    margin: 8px 0;

}

.level p {

    color: #777;

    line-height: 1.5;
}

.play {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background: #667eea;

    color: white;

    font-size: 16px;

    cursor: pointer;
}

.play:hover {

    background: #5568d9;
}

.play.locked-button {

    background: #999;

    cursor: not-allowed;
}

.locked {

    opacity: 0.65;
}

.lock-icon {

    position: absolute;

    top: 20px;

    right: 20px;

    font-size: 25px;
}

.approved-badge {

    display: inline-block;

    background: #d4edda;

    color: #155724;

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 12px;

    margin-top: 5px;
}

.pending-badge {

    display: inline-block;

    background: #fff3cd;

    color: #856404;

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 12px;

    margin-top: 5px;
}

/* =========================
   LEVEL STATUS
========================= */

.level-status {

    display: inline-block;

    margin-top: 5px;

    padding: 5px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;
}

.status-unlocked {

    background: #d4edda;

    color: #155724;
}

.status-locked {

    background: #f1f1f1;

    color: #777;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .levels {

        grid-template-columns: 1fr;
    }

    .header h1 {

        font-size: 28px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <div class="header">

        <div class="logo">
            🧠
        </div>

        <h1>
            Gemini ရာထူးဝင်ခွင့်သင်တန်း
        </h1>

        <p>
            General Knowledge Challenge
        </p>


        <div
            class="user-area"
            id="userArea">

        </div>

    </div>


    <!-- =========================
         LEVELS
         LEVEL 1 - 50
    ========================== -->

    <div
        class="levels"
        id="levelsContainer">

    </div>


</div>


<script>

/* =========================================
   SETTINGS
========================================= */

const TOTAL_LEVELS = 50;

const QUESTIONS_PER_LEVEL = 50;

const PASS_MARK = 90;


/* =========================================
   GET CURRENT USER
========================================= */

function getCurrentUser() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );

    } catch (error) {

        return null;

    }

}


/* =========================================
   GET USER FROM DATABASE
========================================= */

function getLatestUser() {

    const currentUser =
        getCurrentUser();


    if (!currentUser) {

        return null;

    }


    let users = [];

    try {

        users =
            JSON.parse(
                localStorage.getItem(
                    "users"
                )
            ) || [];

    } catch (error) {

        users = [];

    }


    return users.find(
        function(user) {

            return (
                user.email ===
                currentUser.email
            );

        }
    ) || null;

}


/* =========================================
   GET UNLOCKED LEVEL
========================================= */

function getUnlockedLevel() {

    const savedLevel =
        Number(
            localStorage.getItem(
                "unlockedLevel"
            )
        );


    if (
        !Number.isInteger(savedLevel) ||
        savedLevel < 1
    ) {

        return 1;

    }


    return Math.min(
        savedLevel,
        TOTAL_LEVELS
    );

}


/* =========================================
   HEADER
========================================= */

function updateHeader() {

    const area =
        document.getElementById(
            "userArea"
        );


    area.innerHTML = "";


    const currentUser =
        getCurrentUser();


    if (!currentUser) {

        area.innerHTML = `

            <span class="user-name">
                You are playing as Guest
            </span>

            <button
                class="login-btn"
                onclick="goLogin()">

                🔐 Login / Register

            </button>

        `;

        return;

    }


    const user =
        getLatestUser();


    const approved =
        user &&
        user.approved === true;


    area.innerHTML = `

        <span class="user-name">

            👤 Welcome,
            ${escapeHTML(
                currentUser.name ||
                currentUser.email
            )}

        </span>

        ${
            approved

            ?

            `
            <span class="approved-badge">
                ✓ Approved
            </span>
            `

            :

            `
            <span class="pending-badge">
                ⏳ Account
            </span>
            `
        }

        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    `;

}


/* =========================================
   LEVEL TITLE
========================================= */

function getLevelTitle(level) {

    if (level === 1) {

        return "🟢 ASEAN";

    }

    if (level === 2) {

        return "🔵 United Nations (UN)";

    }

    if (level === 3) {

        return "🟡 World General Knowledge";

    }

    if (level === 4) {

        return "🟠 World General Knowledge";

    }

    if (
        level >= 5 &&
        level <= 15
    ) {

        return "🔴 General Questions";

    }

    if (
        level >= 16 &&
        level <= 20
    ) {

        return "🟣 Additional Questions";

    }

    return "⚫ Extra Questions";

}


/* =========================================
   LEVEL DESCRIPTION
========================================= */

function getLevelDescription(level) {

    return `
        ${QUESTIONS_PER_LEVEL} Questions<br>
        10 Minutes<br>
        Pass Mark: ${PASS_MARK}%
    `;

}


/* =========================================
   CREATE ALL LEVELS
========================================= */

function createLevels() {

    const container =
        document.getElementById(
            "levelsContainer"
        );


    container.innerHTML = "";


    const unlockedLevel =
        getUnlockedLevel();


    for (
        let level = 1;
        level <= TOTAL_LEVELS;
        level++
    ) {

        const isUnlocked =
            level <= unlockedLevel;


        const card =
            document.createElement(
                "div"
            );


        card.className =
            "level";


        if (!isUnlocked) {

            card.classList.add(
                "locked"
            );

        }


        const lockIcon =
            isUnlocked
            ? "🔓"
            : "🔒";


        const buttonText =
            isUnlocked
            ? "▶ Start Level " + level
            : "🔒 Locked";


        const statusText =
            isUnlocked
            ? "✓ Unlocked"
            : "🔒 Locked";


        const statusClass =
            isUnlocked
            ? "status-unlocked"
            : "status-locked";


        card.innerHTML = `

            <div class="lock-icon">
                ${lockIcon}
            </div>

            <div class="level-number">
                LEVEL ${level}
            </div>

            <h2>
                ${getLevelTitle(level)}
            </h2>

            <p>
                ${getLevelDescription(level)}
            </p>

            <span
                class="level-status ${statusClass}">

                ${statusText}

            </span>

            <br><br>

            <button
                class="play ${
                    isUnlocked
                    ? ""
                    : "locked-button"
                }"
                onclick="startLevel(${level})">

                ${buttonText}

            </button>

        `;


        container.appendChild(
            card
        );

    }

}


/* =========================================
   START LEVEL
========================================= */

function startLevel(level) {

    if (
        !Number.isInteger(level) ||
        level < 1 ||
        level > TOTAL_LEVELS
    ) {

        alert(
            "Invalid level."
        );

        return;

    }


    const unlockedLevel =
        getUnlockedLevel();


    /* =========================
       CHECK UNLOCK
    ========================= */

    if (
        level > unlockedLevel
    ) {

        alert(

            "🔒 Level " +
            level +
            " is locked.\n\n" +

            "Please pass Level " +
            (level - 1) +
            " with " +
            PASS_MARK +
            "% or higher."

        );

        return;

    }


    /* =========================
       OPEN QUIZ
    ========================= */

    window.location.href =
        "quiz.html?level=" +
        level;

}


/* =========================================
   LOGIN
========================================= */

function goLogin() {

    window.location.href =
        "login.html";

}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    localStorage.removeItem(
        "currentUser"
    );

    window.location.reload();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   INITIALIZE
========================================= */

updateHeader();

createLevels();

</script>

</body>

</html>
