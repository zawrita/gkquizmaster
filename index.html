<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini ရာထူးဝင်ခွင့်သင်တန်း</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 30px 20px;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
}

/* HEADER */

.header {
    background: white;
    padding: 30px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 15px 35px rgba(0,0,0,0.18);
    margin-bottom: 25px;
}

.logo {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 10px;
}

.logo img {
    width: 110px;
    height: 110px;
    object-fit: contain;
    border-radius: 18px;
}

.header h1 {
    margin: 5px 0;
    color: #667eea;
    font-size: 35px;
}

.header p {
    color: #777;
    margin: 5px 0 20px;
}

.user-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.user-name {
    color: #555;
    font-weight: bold;
}

.login-btn,
.logout-btn,
.admin-btn {
    border: none;
    padding: 10px 18px;
    border-radius: 9px;
    color: white;
    cursor: pointer;
    font-size: 14px;
}

.login-btn {
    background: #667eea;
}

.logout-btn {
    background: #dc3545;
}

.admin-btn {
    background: #333;
}

.login-btn:hover {
    background: #5568d9;
}

.logout-btn:hover {
    background: #bb2d3b;
}

.admin-btn:hover {
    background: #222;
}

/* ACCESS INFORMATION */

.access-info {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);
}

.access-info h3 {
    margin: 0 0 10px;
    color: #333;
}

.access-info p {
    margin: 7px 0;
    color: #666;
    line-height: 1.6;
}

.public-text {
    color: #28a745;
    font-weight: bold;
}

/* LEVELS */

.levels {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.level {
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    position: relative;
    transition: 0.2s;
}

.level:hover {
    transform: translateY(-4px);
}

.level-number {
    font-size: 14px;
    color: #667eea;
    font-weight: bold;
}

.level h2 {
    margin: 8px 0;
    padding-right: 10px;
    font-size: 21px;
    line-height: 1.4;
}

.level p {
    color: #777;
    line-height: 1.5;
}

.play {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: #667eea;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.play:hover {
    background: #5568d9;
}

.lock-icon {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 25px;
}

.level-status {
    display: inline-block;
    margin-top: 5px;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.status-public {
    background: #d4edda;
    color: #155724;
}

/* FOOTER */

.footer {
    text-align: center;
    color: white;
    margin-top: 25px;
    font-size: 13px;
    opacity: 0.9;
}

/* MOBILE */

@media (max-width: 700px) {

    body {
        padding: 20px 12px;
    }

    .levels {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 28px;
    }

    .logo img {
        width: 90px;
        height: 90px;
    }

    .level h2 {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            <img src="logo.jpg" alt="Gemini Class Logo">
        </div>

        <h1>Gemini ရာထူးဝင်ခွင့်သင်တန်း</h1>

        <p>General Knowledge Challenge</p>

        <div class="user-area" id="userArea"></div>

    </div>


    <!-- ACCESS INFORMATION -->

    <div class="access-info">

        <h3>🎯 Quiz Access</h3>

        <p>
            <span class="public-text">🟢 Level 1–20</span>
            — Public Visitor Access
        </p>

        <p>
            Level အားလုံးကို Login / Register မလိုဘဲ
            Visitor အနေဖြင့် ဝင်ရောက်ဖြေဆိုနိုင်ပါသည်။
        </p>

    </div>


    <!-- LEVELS -->

    <div class="levels" id="levelsContainer"></div>


    <div class="footer">
        GK Quiz Master © 2026
    </div>

</div>


<script>

/* =========================================
   SETTINGS
========================================= */

const TOTAL_LEVELS = 20;
const QUESTIONS_PER_LEVEL = 50;


/* =========================================
   LEVEL TITLES
========================================= */

const levelTitles = {

    1: "Gemini Class Level 1 - ASEAN",

    2: "Gemini Class Level 2 - United Nations",

    3: "Gemini Class Level 3 - MOFA ငယ်/ရေး Objectives Chapter 1",

    4: "Gemini Class Level 4 - MOFA ငယ်/ရေး Objectives Chapter 2",

    5: "Gemini Class Level 5 - MOFA ငယ်/ရေး Objectives Chapter 3",

    6: "Gemini Class Level 6 - MOFA ငယ်/ရေး Objectives Chapter 4",

    7: "Gemini Class Level 7 - MOFA ငယ်/ရေး Objectives Chapter 5",

    8: "Gemini Class Level 8 - MOFA ငယ်/ရေး Objectives Chapter 6",

    9: "Gemini Class Level 9 - MOFA ငယ်/ရေး Objectives Chapter 7",

    10: "Gemini Class Level 10 - MOFA ငယ်/ရေး Objectives Chapter 8",

    11: "Gemini Class Level 11 - MOFA ငယ်/ရေး Objectives Chapter 9",

    12: "Gemini Class Level 12 - MOFA ငယ်/ရေး Objectives Chapter 10",

    13: "Gemini Class Level 13 - MOFA ငယ်/ရေး English Chapter 1",

    14: "Gemini Class Level 14 - MOFA ငယ်/ရေး English Chapter 2",

    15: "Gemini Class Level 15 - MOFA ငယ်/ရေး English Chapter 3",

    16: "Gemini Class Level 16 - MOFA ငယ်/ရေး English Chapter 4",

    17: "Gemini Class Level 17 - MOFA ငယ်/ရေး English Chapter 5",

    18: "Gemini Class Level 18 - MOFA ငယ်/ရေး English Chapter 6",

    19: "Gemini Class Level 19 - MOFA ငယ်/ရေး English Chapter 7",

    20: "Gemini Class Level 20 - MOFA ငယ်/ရေး English Chapter 8"

};


/* =========================================
   GET CURRENT USER
   =========================================
   
   Login system ရှိနေသေးရင်
   Header မှာ user name ပြနိုင်ရန်သာသုံးသည်။
   
   Quiz Access အတွက် မသုံးပါ။
========================================= */

function getCurrentUser() {

    try {

        return JSON.parse(
            localStorage.getItem("currentUser")
        );

    } catch (error) {

        return null;

    }

}


/* =========================================
   UPDATE HEADER
========================================= */

function updateHeader() {

    const area =
        document.getElementById("userArea");

    const currentUser =
        getCurrentUser();


    /* GUEST */

    if (!currentUser) {

        area.innerHTML = `

            <span class="user-name">
                👤 You are playing as Guest
            </span>

            <span class="level-status status-public">
                🌐 Level 1–20 Public Access
            </span>

            <button
                class="login-btn"
                onclick="goLogin()">

                🔐 Login / Register

            </button>

        `;

        return;

    }


    /* REGISTERED USER */

    area.innerHTML = `

        <span class="user-name">
            👤 Welcome,
            ${escapeHTML(
                currentUser.name ||
                currentUser.email
            )}
        </span>

        <span class="level-status status-public">
            🌐 Level 1–20 Public Access
        </span>

        <button
            class="logout-btn"
            onclick="logout()">

            Logout

        </button>

    `;

}


/* =========================================
   GET LEVEL TITLE
========================================= */

function getLevelTitle(level) {

    return (
        levelTitles[level] ||
        "Gemini Class Level " + level
    );

}


/* =========================================
   LEVEL DESCRIPTION
========================================= */

function getLevelDescription(level) {

    return `
        ${QUESTIONS_PER_LEVEL} Questions<br>
        10 Minutes<br>
        🌐 Visitor Access
    `;

}


/* =========================================
   CREATE LEVELS 1–20
========================================= */

function createLevels() {

    const container =
        document.getElementById(
            "levelsContainer"
        );

    container.innerHTML = "";


    for (
        let level = 1;
        level <= TOTAL_LEVELS;
        level++
    ) {

        const card =
            document.createElement("div");

        card.className = "level";


        card.innerHTML = `

            <div class="lock-icon">
                🌐
            </div>

            <div class="level-number">
                LEVEL ${level}
            </div>

            <h2>
                ${escapeHTML(
                    getLevelTitle(level)
                )}
            </h2>

            <p>
                ${getLevelDescription(level)}
            </p>

            <span class="level-status status-public">
                🌐 Public Access
            </span>

            <br><br>

            <button
                class="play"
                onclick="startLevel(${level})">

                ▶ Start Level ${level}

            </button>

        `;


        container.appendChild(card);

    }

}


/* =========================================
   START LEVEL
========================================= */

function startLevel(level) {

    if (
        !Number.isInteger(level) ||
        level < 1 ||
        level > TOTAL_LEVELS
    ) {

        alert("Invalid level.");

        return;

    }


    /* =====================================
       ALL LEVELS ARE PUBLIC
       NO LOGIN REQUIRED
       NO APPROVAL REQUIRED
       NO LEVEL ACCESS CHECK
    ===================================== */

    window.location.href =
        "quiz.html?level=" + level;

}


/* =========================================
   LOGIN
========================================= */

function goLogin() {

    window.location.href =
        "login.html";

}


/* =========================================
   LOGOUT
========================================= */

function logout() {

    localStorage.removeItem(
        "currentUser"
    );

    window.location.reload();

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =========================================
   INITIALIZE
========================================= */

updateHeader();
createLevels();

</script>

</body>
</html>
