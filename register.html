<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GK Quiz Master - Register</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.register-box {
    width: 100%;
    max-width: 440px;
    background: white;
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.logo {
    text-align: center;
    font-size: 55px;
}

h1 {
    text-align: center;
    margin: 5px 0;
    color: #333;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 28px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    color: #444;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 17px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #667eea;
}

.register-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #667eea;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.register-btn:hover {
    background: #5568d9;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
    min-height: 20px;
}

.login {
    text-align: center;
    margin-top: 20px;
    color: #777;
}

.login a {
    color: #667eea;
    font-weight: bold;
    text-decoration: none;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #777;
    text-decoration: none;
}

.info {
    margin-top: 20px;
    padding: 12px;
    background: #f5f6ff;
    border-radius: 10px;
    text-align: center;
    font-size: 13px;
    color: #666;
}
</style>
</head>

<body>

<div class="register-box">

    <div class="logo">🧠</div>

    <h1>Create Account</h1>

    <div class="subtitle">
        GK Quiz Master
    </div>

    <form onsubmit="register(event)">

        <label>Full Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter your name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
        >

        <button
            type="submit"
            class="register-btn"
        >
            📝 Create Account
        </button>

    </form>

    <div
        class="message"
        id="message"
    ></div>

    <div class="info">
        🔒 New accounts require Admin approval.
        <br>
        Level 3, 4 and 5 require separate Admin access.
    </div>

    <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <a href="index.html" class="back">
        ← Back to Home
    </a>

</div>

<script>

function getUsers() {

    try {
        return JSON.parse(
            localStorage.getItem("users")
        ) || [];
    } catch {
        return [];
    }

}


function saveUsers(users) {

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

}


function register(event) {

    event.preventDefault();

    const name =
        document.getElementById("name")
        .value.trim();

    const email =
        document.getElementById("email")
        .value.trim()
        .toLowerCase();

    const password =
        document.getElementById("password")
        .value;

    const confirmPassword =
        document.getElementById("confirmPassword")
        .value;

    const message =
        document.getElementById("message");


    if (password.length < 6) {

        message.innerText =
            "❌ Password must be at least 6 characters.";

        message.style.color = "#dc3545";

        return;
    }


    if (password !== confirmPassword) {

        message.innerText =
            "❌ Passwords do not match.";

        message.style.color = "#dc3545";

        return;
    }


    const users = getUsers();


    const existing =
        users.find(
            user =>
                String(user.email)
                .toLowerCase() === email
        );


    if (existing) {

        message.innerText =
            "❌ This email is already registered.";

        message.style.color = "#dc3545";

        return;
    }


    const newUser = {

        id: Date.now(),

        name: name,

        email: email,

        password: password,

        approved: false,

        levelAccess: [1, 2],

        createdAt:
            new Date().toLocaleString()

    };


    users.push(newUser);

    saveUsers(users);


    message.innerText =
        "✅ Account created successfully! Please wait for Admin approval.";

    message.style.color = "#28a745";


    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
    document.getElementById("confirmPassword").value = "";

}

</script>

</body>
</html>
