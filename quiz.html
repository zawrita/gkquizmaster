<script src="questions.js?v=6"></script>



<script>

/* =====================================================
   SETTINGS
===================================================== */

const TOTAL_LEVELS = 20;

const QUESTIONS_PER_LEVEL = 50;

const QUIZ_TIME = 600;


/*
=========================================================
PUBLIC ACCESS ONLY

There is NO:

- Login requirement
- Registration requirement
- Admin approval
- Level approval
- levelAccess
- Pass mark
- 90% requirement
- Level unlock
=========================================================
*/


/* =====================================================
   VARIABLES
===================================================== */

let currentLevel = 1;

let quizQuestions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;

let timeLeft = QUIZ_TIME;

let timer = null;

let quizFinished = false;


/* =====================================================
   LEVEL TITLES
===================================================== */

const levelTitles = {

    1:
        "Gemini Class Level 1 - ASEAN",

    2:
        "Gemini Class Level 2 - United Nations",

    3:
        "Gemini Class Level 3 - MOFA ငယ်/ရေး Objectives Chapter 1",

    4:
        "Gemini Class Level 4 - MOFA ငယ်/ရေး Objectives Chapter 2",

    5:
        "Gemini Class Level 5 - MOFA ငယ်/ရေး Objectives Chapter 3",

    6:
        "Gemini Class Level 6 - MOFA ငယ်/ရေး Objectives Chapter 4",

    7:
        "Gemini Class Level 7 - MOFA ငယ်/ရေး Objectives Chapter 5",

    8:
        "Gemini Class Level 8 - MOFA ငယ်/ရေး Objectives Chapter 6",

    9:
        "Gemini Class Level 9 - MOFA ငယ်/ရေး Objectives Chapter 7",

    10:
        "Gemini Class Level 10 - MOFA ငယ်/ရေး Objectives Chapter 8",

    11:
        "Gemini Class Level 11 - MOFA ငယ်/ရေး Objectives Chapter 9",

    12:
        "Gemini Class Level 12 - MOFA ငယ်/ရေး Objectives Chapter 10",

    13:
        "Gemini Class Level 13 - MOFA ငယ်/ရေး English Chapter 1",

    14:
        "Gemini Class Level 14 - MOFA ငယ်/ရေး English Chapter 2",

    15:
        "Gemini Class Level 15 - MOFA ငယ်/ရေး English Chapter 3",

    16:
        "Gemini Class Level 16 - MOFA ငယ်/ရေး English Chapter 4",

    17:
        "Gemini Class Level 17 - MOFA ငယ်/ရေး English Chapter 5",

    18:
        "Gemini Class Level 18 - MOFA ငယ်/ရေး English Chapter 6",

    19:
        "Gemini Class Level 19 - MOFA ငယ်/ရေး English Chapter 7",

    20:
        "Gemini Class Level 20 - MOFA ငယ်/ရေး English Chapter 8"

};


/* =====================================================
   GET LEVEL FROM URL
===================================================== */

function getLevelFromURL() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const value =
        Number(
            params.get("level")
        );


    if (
        !Number.isInteger(value) ||
        value < 1 ||
        value > TOTAL_LEVELS
    ) {

        return null;

    }


    return value;

}


const requestedLevel =
    getLevelFromURL();


/* =====================================================
   VALIDATE URL LEVEL
===================================================== */

if (requestedLevel === null) {

    alert(
        "Invalid quiz level."
    );

    window.location.href =
        "index.html";

}

else {

    currentLevel =
        requestedLevel;

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    const shuffled =
        [...array];


    for (
        let i = shuffled.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }


    return shuffled;

}


/* =====================================================
   SHOW ERROR
===================================================== */

function showQuizError(message) {

    clearInterval(timer);

    document.getElementById(
        "quizBox"
    ).style.display = "block";

    document.getElementById(
        "resultBox"
    ).style.display = "none";

    document.getElementById(
        "levelTitle"
    ).innerText =
        levelTitles[currentLevel] ||
        "Gemini Class Level " + currentLevel;

    document.getElementById(
        "question"
    ).innerText = "";

    document.getElementById(
        "answers"
    ).innerHTML = `
        <div style="
            padding:20px;
            background:#f8d7da;
            color:#721c24;
            border-radius:12px;
            line-height:1.6;
        ">
            ${message}
        </div>
    `;

    document.getElementById(
        "message"
    ).innerText = "";

    document.getElementById(
        "nextButton"
    ).style.display = "none";

}


/* =====================================================
   CREATE QUIZ
===================================================== */

function createQuiz() {

    quizFinished = false;


    /* ---------------------------------------------
       QUESTION BANK CHECK
    --------------------------------------------- */

    if (
        typeof questionBank === "undefined"
    ) {

        showQuizError(
            "Question bank could not be loaded.<br><br>" +
            "Please make sure <strong>questions.js</strong> " +
            "is in the same folder as quiz.html."
        );

        return;

    }


    /* ---------------------------------------------
       CURRENT LEVEL CHECK
    --------------------------------------------- */

    const bank =
        questionBank[currentLevel];


    if (
        !Array.isArray(bank)
    ) {

        showQuizError(

            "Question bank for " +

            "<strong>Level " +
            currentLevel +
            "</strong>" +

            " was not found.<br><br>" +

            "Please check that Level " +
            currentLevel +
            " exists in questions.js."

        );

        return;

    }


    /* ---------------------------------------------
       50 QUESTIONS REQUIRED
    --------------------------------------------- */

    if (
        bank.length <
        QUESTIONS_PER_LEVEL
    ) {

        showQuizError(

            "<strong>Level " +
            currentLevel +
            "</strong> currently has " +

            "<strong>" +
            bank.length +
            "</strong> questions.<br><br>" +

            "This level requires " +
            QUESTIONS_PER_LEVEL +
            " questions."

        );

        return;

    }


    /* ---------------------------------------------
       SELECT RANDOM 50
    --------------------------------------------- */

    quizQuestions =
        shuffle(
            bank
        ).slice(
            0,
            QUESTIONS_PER_LEVEL
        );


    /* ---------------------------------------------
       RESET
    --------------------------------------------- */

    currentQuestion = 0;

    score = 0;

    answered = false;

    timeLeft = QUIZ_TIME;

    document.getElementById(
        "nextButton"
    ).style.display =
        "block";


    /* ---------------------------------------------
       SHOW QUIZ
    --------------------------------------------- */

    document.getElementById(
        "quizBox"
    ).style.display =
        "block";

    document.getElementById(
        "resultBox"
    ).style.display =
        "none";


    /* ---------------------------------------------
       LOAD QUESTION
    --------------------------------------------- */

    loadQuestion();


    /* ---------------------------------------------
       START TIMER
    --------------------------------------------- */

    startTimer();

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

    answered = false;


    const question =
        quizQuestions[
            currentQuestion
        ];


    if (!question) {

        finishQuiz();

        return;

    }


    const total =
        quizQuestions.length;


    /* ---------------------------------------------
       LEVEL TITLE
    --------------------------------------------- */

    document.getElementById(
        "levelTitle"
    ).innerText =

        levelTitles[currentLevel] ||

        "Gemini Class Level " +
        currentLevel;


    /* ---------------------------------------------
       QUESTION NUMBER
    --------------------------------------------- */

    document.getElementById(
        "progressText"
    ).innerText =

        "Question " +

        (currentQuestion + 1) +

        " / " +

        total;


    /* ---------------------------------------------
       QUESTION TEXT
    --------------------------------------------- */

    document.getElementById(
        "question"
    ).innerText =
        question[0];


    /* ---------------------------------------------
       PROGRESS
    --------------------------------------------- */

    const progress =
        (
            (currentQuestion + 1)
            /
            total
        ) * 100;


    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";


    /* ---------------------------------------------
       MESSAGE
    --------------------------------------------- */

    const message =
        document.getElementById(
            "message"
        );

    message.innerText = "";

    message.style.color =
        "#333";


    /* ---------------------------------------------
       ANSWERS CONTAINER
    --------------------------------------------- */

    const answersDiv =
        document.getElementById(
            "answers"
        );

    answersDiv.innerHTML = "";


    /* ---------------------------------------------
       VALIDATE QUESTION
    --------------------------------------------- */

    if (
        !Array.isArray(question) ||
        question.length < 3
    ) {

        answersDiv.innerHTML =
            "<p>Invalid question format.</p>";

        return;

    }


    if (
        !Array.isArray(question[1]) ||
        question[1].length < 2
    ) {

        answersDiv.innerHTML =
            "<p>Invalid answer format.</p>";

        return;

    }


    /* ---------------------------------------------
       CORRECT ANSWER INDEX
    --------------------------------------------- */

    const correctIndex =
        Number(
            question[2]
        );


    if (
        !Number.isInteger(correctIndex) ||
        correctIndex < 0 ||
        correctIndex >= question[1].length
    ) {

        answersDiv.innerHTML =

            "<p>Invalid correct-answer index " +
            "in this question.</p>";

        return;

    }


    /* ---------------------------------------------
       SHUFFLE ANSWERS
    --------------------------------------------- */

    const answers =
        shuffle(

            question[1].map(

                function(answer, index) {

                    return {

                        text: answer,

                        originalIndex:
                            index

                    };

                }

            )

        );


    /* ---------------------------------------------
       CREATE BUTTONS
    --------------------------------------------- */

    answers.forEach(

        function(item, index) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.innerText =

                String.fromCharCode(
                    65 + index
                ) +

                ". " +

                item.text;


            button.dataset.correct =

                (
                    item.originalIndex ===
                    correctIndex
                ).toString();


            button.onclick =
                function() {

                    checkAnswer(
                        button
                    );

                };


            answersDiv.appendChild(
                button
            );

        }

    );


    /* ---------------------------------------------
       NEXT BUTTON
    --------------------------------------------- */

    const nextButton =
        document.getElementById(
            "nextButton"
        );


    if (
        currentQuestion ===
        total - 1
    ) {

        nextButton.innerText =
            "Finish Quiz ✓";

    }

    else {

        nextButton.innerText =
            "Next →";

    }

}


/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(button) {

    if (answered) {

        return;

    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    const isCorrect =
        button.dataset.correct ===
        "true";


    /* ---------------------------------------------
       DISABLE ALL ANSWERS
    --------------------------------------------- */

    buttons.forEach(

        function(btn) {

            btn.disabled = true;

        }

    );


    /* ---------------------------------------------
       CORRECT
    --------------------------------------------- */

    if (isCorrect) {

        button.classList.add(
            "correct"
        );

        button.innerText +=
            " ✓";

        score++;


        const message =
            document.getElementById(
                "message"
            );


        message.innerText =
            "✓ Correct Answer!";


        message.style.color =
            "#28a745";

    }


    /* ---------------------------------------------
       WRONG
    --------------------------------------------- */

    else {

        button.classList.add(
            "wrong"
        );

        button.innerText +=
            " ✗";


        buttons.forEach(

            function(btn) {

                if (
                    btn.dataset.correct ===
                    "true"
                ) {

                    btn.classList.add(
                        "correct"
                    );

                    btn.innerText +=
                        " ✓";

                }

            }

        );


        const message =
            document.getElementById(
                "message"
            );


        message.innerText =
            "✗ Wrong Answer!";


        message.style.color =
            "#dc3545";

    }

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    if (quizFinished) {

        return;

    }


    /* ---------------------------------------------
       MUST ANSWER
    --------------------------------------------- */

    if (!answered) {

        const message =
            document.getElementById(
                "message"
            );


        message.innerText =
            "Please choose an answer first.";


        message.style.color =
            "#dc3545";


        return;

    }


    currentQuestion++;


    /* ---------------------------------------------
       MORE QUESTIONS
    --------------------------------------------- */

    if (
        currentQuestion <
        quizQuestions.length
    ) {

        loadQuestion();

        return;

    }


    /* ---------------------------------------------
       FINISH
    --------------------------------------------- */

    finishQuiz();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    clearInterval(timer);


    timeLeft =
        QUIZ_TIME;


    updateTimerDisplay();


    timer =
        setInterval(

            function() {

                if (quizFinished) {

                    clearInterval(timer);

                    return;

                }


                timeLeft--;


                updateTimerDisplay();


                if (
                    timeLeft <= 0
                ) {

                    clearInterval(timer);

                    finishQuiz();

                }

            },

            1000

        );

}


/* =====================================================
   TIMER DISPLAY
===================================================== */

function updateTimerDisplay() {

    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    document.getElementById(
        "timer"
    ).innerText =

        "⏱️ " +

        minutes +

        ":" +

        String(seconds).padStart(
            2,
            "0"
        );

}


/* =====================================================
   FINISH QUIZ
===================================================== */

function finishQuiz() {

    if (quizFinished) {

        return;

    }


    quizFinished = true;


    clearInterval(timer);


    const total =
        quizQuestions.length;


    if (total === 0) {

        return;

    }


    const percentage =
        Math.round(
            (
                score /
                total
            ) * 100
        );


    /* ---------------------------------------------
       HIDE QUIZ
    --------------------------------------------- */

    document.getElementById(
        "quizBox"
    ).style.display =
        "none";


    /* ---------------------------------------------
       SHOW RESULT
    --------------------------------------------- */

    document.getElementById(
        "resultBox"
    ).style.display =
        "block";


    /* ---------------------------------------------
       RESULT
    --------------------------------------------- */

    document.getElementById(
        "resultTitle"
    ).innerText =
        "🎉 Quiz Completed!";


    document.getElementById(
        "score"
    ).innerText =

        score +
        " / " +
        total;


    document.getElementById(
        "percentage"
    ).innerText =

        percentage +
        "%";


    document.getElementById(
        "status"
    ).innerText =
        "Completed";


    document.getElementById(
        "status"
    ).style.color =
        "#667eea";


    document.getElementById(
        "resultMessage"
    ).innerText =

        "You scored " +

        percentage +

        "% in\n\n" +

        (
            levelTitles[currentLevel] ||
            "Gemini Class Level " +
            currentLevel
        ) +

        ".\n\n" +

        "There is no pass mark or level unlock requirement.\n" +

        "You may try again or continue to the next level.";


    /* ---------------------------------------------
       NEXT LEVEL
    --------------------------------------------- */

    const nextButton =
        document.getElementById(
            "nextLevelButton"
        );


    if (
        currentLevel <
        TOTAL_LEVELS
    ) {

        nextButton.style.display =
            "inline-block";


        nextButton.innerText =

            "➡️ Next Level " +

            (currentLevel + 1);

    }

    else {

        nextButton.style.display =
            "none";

    }

}


/* =====================================================
   TRY AGAIN
===================================================== */

function restartQuiz() {

    createQuiz();

}


/* =====================================================
   NEXT LEVEL
===================================================== */

function goNextLevel() {

    if (
        currentLevel >=
        TOTAL_LEVELS
    ) {

        return;

    }


    const nextLevel =
        currentLevel + 1;


    /*
       DIRECT PUBLIC ACCESS

       No login.
       No approval.
       No pass mark.
       No unlock.
    */

    window.location.href =

        "quiz.html?level=" +

        encodeURIComponent(
            nextLevel
        );

}


/* =====================================================
   HOME
===================================================== */

function goHome() {

    clearInterval(timer);

    window.location.href =
        "index.html";
