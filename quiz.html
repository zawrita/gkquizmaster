<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GK Quiz Master</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.quiz-box {
    width: 100%;
    max-width: 720px;
    background: white;
    padding: 35px;
    border-radius: 22px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

.top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
}

.level-title {
    font-size: 20px;
    font-weight: bold;
    color: #667eea;
}

.timer {
    font-size: 18px;
    font-weight: bold;
}

.progress-text {
    color: #777;
    margin-bottom: 8px;
}

.progress-container {
    width: 100%;
    height: 10px;
    background: #eee;
    border-radius: 10px;
    margin-bottom: 25px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #667eea;
    border-radius: 10px;
    transition: width 0.3s;
}

.question {
    font-size: 25px;
    font-weight: bold;
    line-height: 1.4;
    margin-bottom: 25px;
}

.answer {
    width: 100%;
    padding: 16px;
    margin: 8px 0;
    border: 2px solid #ddd;
    background: white;
    border-radius: 12px;
    text-align: left;
    font-size: 17px;
    cursor: pointer;
}

.answer:hover {
    background: #f1f2ff;
}

.answer.correct {
    background: #d4edda !important;
    border-color: #28a745 !important;
    color: #155724;
}

.answer.wrong {
    background: #f8d7da !important;
    border-color: #dc3545 !important;
    color: #721c24;
}

.message {
    text-align: center;
    font-size: 19px;
    font-weight: bold;
    min-height: 25px;
    margin-top: 15px;
}

.next {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: #667eea;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.result {
    display: none;
    text-align: center;
}

.result h1 {
    font-size: 32px;
}

.score {
    font-size: 55px;
    font-weight: bold;
    color: #667eea;
    margin: 20px;
}

.percentage {
    font-size: 25px;
    margin-bottom: 10px;
}

.status {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 20px;
}

.result-message {
    font-size: 18px;
    line-height: 1.5;
    margin-bottom: 20px;
}

.restart,
.home {
    padding: 14px 25px;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin: 5px;
}

.restart {
    background: #667eea;
}

.home {
    background: #555;
}

.next-level {
    background: #28a745;
}

@media(max-width:600px) {
    .quiz-box {
        padding: 25px;
    }

    .question {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="quiz-box" id="quizBox">

    <div class="top">
        <div class="level-title" id="levelTitle">
            Level 1
        </div>

        <div class="timer" id="timer">
            ⏱️ 60
        </div>
    </div>

    <div class="progress-text" id="progressText">
        Question 1 / 10
    </div>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question" id="question"></div>

    <div id="answers"></div>

    <div class="message" id="message"></div>

    <button class="next" id="nextButton" onclick="nextQuestion()">
        Next →
    </button>

</div>


<div class="quiz-box result" id="resultBox">

    <h1 id="resultTitle">
        🎉 Quiz Completed!
    </h1>

    <p>Your Score</p>

    <div class="score" id="score">
        0 / 10
    </div>

    <div class="percentage" id="percentage">
        0%
    </div>

    <div class="status" id="status"></div>

    <div class="result-message" id="resultMessage"></div>

    <button class="restart" onclick="restartQuiz()">
        🔄 Try Again
    </button>

    <button class="next-level" id="nextLevelButton"
            onclick="goNextLevel()"
            style="display:none;">
        🔓 Next Level
    </button>

    <button class="home" onclick="goHome()">
        🏠 Home
    </button>

</div>


<!-- Question Bank -->
<script src="questions.js"></script>

<script>

const QUESTIONS_PER_QUIZ = 50;
const TIME_PER_QUIZ = 600;
const PASS_MARK = 90;

let currentLevel = 1;
let quizQuestions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;
let timeLeft = TIME_PER_QUIZ;
let timer;


/* =========================
   GET LEVEL
========================= */

const urlParams =
    new URLSearchParams(window.location.search);

if (urlParams.get("level")) {

    currentLevel =
        Number(urlParams.get("level"));

}


/* =========================
   CHECK LEVEL PERMISSION
========================= */

function checkLevelPermission() {

    /* Level 1 and 2 are public */

    if (
        currentLevel === 1 ||
        currentLevel === 2
    ) {

        return true;

    }


    /* Level must be between 1 and 5 */

    if (
        currentLevel < 1 ||
        currentLevel > 5
    ) {

        alert(
            "Invalid quiz level."
        );

        window.location.href =
            "index.html";

        return false;

    }


    /* Get logged-in user */

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );


    /* Login required */

    if (!currentUser) {

        alert(
            "🔐 Please login first.\n\n" +
            "Levels 3, 4 and 5 require " +
            "an Admin-approved account."
        );

        window.location.href =
            "login.html";

        return false;

    }


    /* Get latest user data */

    const users =
        JSON.parse(
            localStorage.getItem(
                "users"
            )
        ) || [];


    const user =
        users.find(
            function(u) {

                return (
                    u.email ===
                    currentUser.email
                );

            }
        );


    /* User not found */

    if (!user) {

        localStorage.removeItem(
            "currentUser"
        );

        alert(
            "Your account could not be found."
        );

        window.location.href =
            "login.html";

        return false;

    }


    /* Admin approval check */

    if (
        user.approved !== true
    ) {

        alert(
            "⏳ Your account is not approved yet.\n\n" +
            "Please wait for Admin approval."
        );

        window.location.href =
            "index.html";

        return false;

    }


    /* Permission granted */

    return true;

}


/* =========================
   RUN PERMISSION CHECK
========================= */

if (!checkLevelPermission()) {

    throw new Error(
        "Access denied."
    );
}


/* =========================
   SHUFFLE
========================= */

function shuffle(array) {

    return array
        .map(value => ({
            value: value,
            sort: Math.random()
        }))
        .sort((a, b) => a.sort - b.sort)
        .map(({value}) => value);

}


/* =========================
   CREATE QUIZ
========================= */

function createQuiz() {

    const bank = questionBank[currentLevel];

    if (!bank) {

        alert("Question bank not found!");

        window.location.href = "index.html";

        return;
    }

    const questionsToUse =
    currentLevel === 1 ? 50 : QUESTIONS_PER_QUIZ;

quizQuestions =
    shuffle([...bank]).slice(
        0,
        Math.min(
            questionsToUse,
            bank.length
            )
        );

    currentQuestion = 0;
    score = 0;

    document.getElementById("quizBox").style.display = "block";
    document.getElementById("resultBox").style.display = "none";

    loadQuestion();
    startTimer();
}


/* =========================
   LOAD QUESTION
========================= */

function loadQuestion() {

    answered = false;

    const question =
        quizQuestions[currentQuestion];

    const total =
        quizQuestions.length;

    document.getElementById("levelTitle").innerText =
        "Level " + currentLevel;

    document.getElementById("progressText").innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        total;

    document.getElementById("question").innerText =
        question[0];

    const progress =
        ((currentQuestion + 1) / total) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";

    document.getElementById("message").innerText = "";

    const answersDiv =
        document.getElementById("answers");

    answersDiv.innerHTML = "";

    const answers =
        shuffle(
            question[1].map(
                (answer, index) => ({
                    text: answer,
                    originalIndex: index
                })
            )
        );

    answers.forEach(function(item, index) {

        const button =
            document.createElement("button");

        button.className = "answer";

        button.innerText =
            String.fromCharCode(65 + index) +
            ". " +
            item.text;

        button.dataset.correct =
            item.originalIndex === question[2];

        button.onclick = function() {
            checkAnswer(button);
        };

        answersDiv.appendChild(button);

    });

    if (currentQuestion === total - 1) {

        document.getElementById("nextButton").innerText =
            "Finish Quiz ✓";

    } else {

        document.getElementById("nextButton").innerText =
            "Next →";

    }
}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(button) {

    if (answered) {
        return;
    }

    answered = true;

    const buttons =
        document.querySelectorAll(".answer");

    const isCorrect =
        button.dataset.correct === "true";

    if (isCorrect) {

        button.classList.add("correct");
        button.innerText += " ✓";

        score++;

        document.getElementById("message").innerText =
            "✓ Correct Answer!";

        document.getElementById("message").style.color =
            "#28a745";

    } else {

        button.classList.add("wrong");
        button.innerText += " ✗";

        buttons.forEach(function(btn) {

            if (btn.dataset.correct === "true") {

                btn.classList.add("correct");
                btn.innerText += " ✓";

            }

        });

        document.getElementById("message").innerText =
            "✗ Wrong Answer!";

        document.getElementById("message").style.color =
            "#dc3545";
    }
}


/* =========================
   NEXT
========================= */

function nextQuestion() {

    if (!answered) {

        document.getElementById("message").innerText =
            "Please choose an answer first.";

        document.getElementById("message").style.color =
            "#dc3545";

        return;
    }

    currentQuestion++;

    if (currentQuestion < quizQuestions.length) {

        loadQuestion();

    } else {

        finishQuiz();

    }
}


/* =========================
   TIMER
========================= */

function startTimer() {

    clearInterval(timer);

    timeLeft = TIME_PER_QUIZ;

    document.getElementById("timer").innerText =
        "⏱️ " + timeLeft;

    timer = setInterval(function() {

        timeLeft--;

        document.getElementById("timer").innerText =
            "⏱️ " + timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timer);

            finishQuiz();

        }

    }, 1000);
}


/* =========================
   FINISH QUIZ
========================= */

function finishQuiz() {

    clearInterval(timer);

    document.getElementById("quizBox").style.display =
        "none";

    document.getElementById("resultBox").style.display =
        "block";

    const total =
        quizQuestions.length;

    const percentage =
        Math.round((score / total) * 100);

    document.getElementById("score").innerText =
        score + " / " + total;

    document.getElementById("percentage").innerText =
        percentage + "%";


    /* =========================
       SAVE BEST SCORE
    ========================= */

    const bestKey =
        "level" + currentLevel + "Best";

    const oldBest =
        Number(localStorage.getItem(bestKey)) || 0;

    if (percentage > oldBest) {

        localStorage.setItem(
            bestKey,
            percentage
        );

    }


    /* =========================
       PASS / FAIL
    ========================= */

    if (percentage >= PASS_MARK) {

        document.getElementById("status").innerText =
            "🎉 PASS";

        document.getElementById("status").style.color =
            "#28a745";

        document.getElementById("resultTitle").innerText =
            "🏆 Excellent!";

        document.getElementById("resultMessage").innerText =
            "You scored " +
            percentage +
            "% and passed Level " +
            currentLevel +
            "!";


        /* =========================
           UNLOCK NEXT LEVEL
        ========================= */

        const currentUnlocked =
            Number(
                localStorage.getItem("unlockedLevel")
            ) || 1;

        if (
            currentLevel < 5 &&
            currentLevel + 1 > currentUnlocked
        ) {

            localStorage.setItem(
                "unlockedLevel",
                currentLevel + 1
            );

        }


        /* NEXT LEVEL BUTTON */

        if (currentLevel < 5) {

            document.getElementById(
                "nextLevelButton"
            ).style.display = "inline-block";

        } else {

            document.getElementById(
                "resultMessage"
            ).innerText =
                "🏆 Congratulations! You completed all 5 levels!";

        }


    } else {


        document.getElementById("status").innerText =
            "❌ FAIL";

        document.getElementById("status").style.color =
            "#dc3545";

        document.getElementById("resultTitle").innerText =
            "Keep Practicing!";

        document.getElementById("resultMessage").innerText =
            "You need at least " +
            PASS_MARK +
            "% to pass this level.\n\n" +
            "Try again and improve your score!";

        document.getElementById(
            "nextLevelButton"
        ).style.display = "none";

    }
}


/* =========================
   TRY AGAIN
========================= */

function restartQuiz() {

    createQuiz();

}


/* =========================
   NEXT LEVEL
========================= */

function goNextLevel() {

    if (currentLevel < 5) {

        window.location.href =
            "quiz.html?level=" +
            (currentLevel + 1);

    }

}


/* =========================
   HOME
========================= */

function goHome() {

    clearInterval(timer);

    window.location.href =
        "index.html";

}


/* =========================
   START
========================= */

createQuiz();

</script>

</body>
</html>
