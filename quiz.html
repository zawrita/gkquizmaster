<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GK Quiz Master</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =========================
   BODY
========================= */

body {

    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


/* =========================
   QUIZ BOX
========================= */

.quiz-box {

    width: 100%;

    max-width: 720px;

    background: white;

    padding: 35px;

    border-radius: 22px;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,0.2);
}


/* =========================
   TOP
========================= */

.top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}


.level-title {

    font-size: 20px;

    font-weight: bold;

    color: #667eea;
}


.timer {

    font-size: 20px;

    font-weight: bold;
}


/* =========================
   PROGRESS
========================= */

.progress-text {

    color: #777;

    margin-bottom: 8px;

    font-size: 16px;
}


.progress-container {

    width: 100%;

    height: 10px;

    background: #eee;

    border-radius: 10px;

    margin-bottom: 25px;

    overflow: hidden;
}


.progress-bar {

    width: 0%;

    height: 100%;

    background: #667eea;

    border-radius: 10px;

    transition: width 0.3s;
}


/* =========================
   QUESTION
========================= */

.question {

    font-size: 25px;

    font-weight: bold;

    line-height: 1.5;

    margin-bottom: 25px;
}


/* =========================
   ANSWERS
========================= */

.answer {

    width: 100%;

    padding: 16px;

    margin: 8px 0;

    border: 2px solid #ddd;

    background: white;

    border-radius: 12px;

    text-align: left;

    font-size: 17px;

    cursor: pointer;

    transition: 0.2s;
}


.answer:hover {

    background: #f1f2ff;

    border-color: #667eea;
}


.answer.correct {

    background: #d4edda !important;

    border-color: #28a745 !important;

    color: #155724;
}


.answer.wrong {

    background: #f8d7da !important;

    border-color: #dc3545 !important;

    color: #721c24;
}


/* =========================
   MESSAGE
========================= */

.message {

    text-align: center;

    font-size: 19px;

    font-weight: bold;

    min-height: 25px;

    margin-top: 15px;
}


/* =========================
   NEXT BUTTON
========================= */

.next {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: none;

    border-radius: 12px;

    background: #667eea;

    color: white;

    font-size: 18px;

    cursor: pointer;
}


.next:hover {

    background: #5568d9;
}


/* =========================
   RESULT
========================= */

.result {

    display: none;

    text-align: center;
}


.result h1 {

    font-size: 32px;
}


.score {

    font-size: 55px;

    font-weight: bold;

    color: #667eea;

    margin: 20px;
}


.percentage {

    font-size: 25px;

    margin-bottom: 10px;
}


.status {

    font-size: 23px;

    font-weight: bold;

    margin-bottom: 20px;
}


.result-message {

    font-size: 18px;

    line-height: 1.5;

    margin-bottom: 20px;

    white-space: pre-line;
}


/* =========================
   RESULT BUTTONS
========================= */

.restart,
.home,
.next-level {

    padding: 14px 25px;

    border: none;

    border-radius: 10px;

    color: white;

    font-size: 16px;

    cursor: pointer;

    margin: 5px;
}


.restart {

    background: #667eea;
}


.home {

    background: #555;
}


.next-level {

    background: #28a745;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .quiz-box {

        padding: 25px;
    }


    .question {

        font-size: 21px;
    }


    .answer {

        font-size: 16px;

        padding: 14px;
    }


    .timer {

        font-size: 17px;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     QUIZ BOX
===================================================== -->

<div class="quiz-box" id="quizBox">

    <div class="top">

        <div class="level-title"
             id="levelTitle">

            Level 1

        </div>


        <div class="timer"
             id="timer">

            ⏱️ 10:00

        </div>

    </div>


    <div class="progress-text"
         id="progressText">

        Question 1 / 50

    </div>


    <div class="progress-container">

        <div class="progress-bar"
             id="progressBar">
        </div>

    </div>


    <div class="question"
         id="question">
    </div>


    <div id="answers">
    </div>


    <div class="message"
         id="message">
    </div>


    <button class="next"
            id="nextButton"
            onclick="nextQuestion()">

        Next →

    </button>

</div>



<!-- =====================================================
     RESULT BOX
===================================================== -->

<div class="quiz-box result"
     id="resultBox">

    <h1 id="resultTitle">

        🎉 Quiz Completed!

    </h1>


    <p>Your Score</p>


    <div class="score"
         id="score">

        0 / 50

    </div>


    <div class="percentage"
         id="percentage">

        0%

    </div>


    <div class="status"
         id="status">
    </div>


    <div class="result-message"
         id="resultMessage">
    </div>


    <button class="restart"
            onclick="restartQuiz()">

        🔄 Try Again

    </button>


    <button class="next-level"
            id="nextLevelButton"
            onclick="goNextLevel()"
            style="display:none;">

        🔓 Next Level

    </button>


    <button class="home"
            onclick="goHome()">

        🏠 Home

    </button>

</div>



<!-- =====================================================
     QUESTION BANK
===================================================== -->

<script src="questions.js?v=3"></script>


<script>

/* =====================================================
   QUIZ SETTINGS
===================================================== */


/*
   TOTAL LEVELS
*/

const TOTAL_LEVELS = 50;


/*
   EVERY LEVEL = 50 QUESTIONS
*/

const QUESTIONS_PER_LEVEL = 50;


/*
   PASS MARK = 90%
*/

const PASS_MARK = 90;


/*
   50 QUESTIONS
   10 MINUTES
*/

const QUIZ_TIME = 600;



/* =====================================================
   VARIABLES
===================================================== */

let currentLevel = 1;

let quizQuestions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;

let timeLeft = QUIZ_TIME;

let timer = null;

let quizFinished = false;



/* =====================================================
   GET LEVEL FROM URL
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


if (urlParams.has("level")) {

    currentLevel =
        Number(
            urlParams.get("level")
        );

}



/* =====================================================
   CHECK VALID LEVEL
===================================================== */

if (
    !Number.isInteger(currentLevel) ||
    currentLevel < 1 ||
    currentLevel > TOTAL_LEVELS
) {

    alert("Invalid quiz level.");

    window.location.href =
        "index.html";

}



/* =====================================================
   CHECK LEVEL UNLOCK
===================================================== */

function checkLevelPermission() {

    /*
       LEVEL 1 IS ALWAYS OPEN
    */

    if (currentLevel === 1) {

        return true;

    }


    /*
       GET UNLOCKED LEVEL
    */

    const unlockedLevel =
        Number(
            localStorage.getItem(
                "unlockedLevel"
            )
        ) || 1;


    /*
       CHECK
    */

    if (
        currentLevel >
        unlockedLevel
    ) {

        alert(
            "🔒 Level " +
            currentLevel +
            " is locked.\n\n" +
            "Pass the previous level with " +
            PASS_MARK +
            "% or higher to unlock it."
        );

        window.location.href =
            "index.html";

        return false;

    }


    return true;

}



/* =====================================================
   RUN PERMISSION CHECK
===================================================== */

if (
    !checkLevelPermission()
) {

    throw new Error(
        "Access denied."
    );

}



/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    return array
        .map(
            function(value) {

                return {

                    value: value,

                    sort: Math.random()

                };

            }
        )
        .sort(
            function(a,b) {

                return a.sort - b.sort;

            }
        )
        .map(
            function(item) {

                return item.value;

            }
        );

}



/* =====================================================
   CREATE QUIZ
===================================================== */

function createQuiz() {


    /*
       RESET FINISH STATUS
    */

    quizFinished = false;


    /*
       GET CURRENT LEVEL BANK
    */

    const bank =
        questionBank[currentLevel];


    /*
       CHECK QUESTION BANK
    */

    if (
        !Array.isArray(bank)
    ) {

        alert(
            "Question bank not found for Level " +
            currentLevel +
            "."
        );

        window.location.href =
            "index.html";

        return;

    }


    /*
       EVERY LEVEL MUST HAVE
       AT LEAST 50 QUESTIONS
    */

    if (
        bank.length < QUESTIONS_PER_LEVEL
    ) {

        alert(
            "Level " +
            currentLevel +
            " needs 50 questions.\n\n" +
            "Current questions found: " +
            bank.length
        );

        window.location.href =
            "index.html";

        return;

    }


    /*
       USE ALL 50 QUESTIONS

       RANDOM ORDER
    */

    quizQuestions =
        shuffle(
            [...bank]
        ).slice(
            0,
            QUESTIONS_PER_LEVEL
        );


    /*
       RESET
    */

    currentQuestion = 0;

    score = 0;

    answered = false;

    timeLeft = QUIZ_TIME;


    /*
       RESET RESULT
    */

    document.getElementById(
        "resultBox"
    ).style.display =
        "none";


    document.getElementById(
        "quizBox"
    ).style.display =
        "block";


    /*
       LOAD FIRST QUESTION
    */

    loadQuestion();


    /*
       START TIMER
    */

    startTimer();

}



/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {


    answered = false;


    /*
       CURRENT QUESTION
    */

    const question =
        quizQuestions[
            currentQuestion
        ];


    /*
       TOTAL
    */

    const total =
        quizQuestions.length;


    /*
       LEVEL TITLE
    */

    document.getElementById(
        "levelTitle"
    ).innerText =
        "Level " +
        currentLevel;


    /*
       QUESTION NUMBER
    */

    document.getElementById(
        "progressText"
    ).innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        total;


    /*
       QUESTION TEXT
    */

    document.getElementById(
        "question"
    ).innerText =
        question[0];


    /*
       PROGRESS
    */

    const progress =
        (
            (currentQuestion + 1)
            /
            total
        ) * 100;


    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";


    /*
       CLEAR MESSAGE
    */

    document.getElementById(
        "message"
    ).innerText = "";


    /*
       CLEAR ANSWERS
    */

    const answersDiv =
        document.getElementById(
            "answers"
        );


    answersDiv.innerHTML = "";


    /*
       SHUFFLE ANSWERS
    */

    const answers =
        shuffle(
            question[1].map(
                function(answer,index) {

                    return {

                        text: answer,

                        originalIndex:
                            index

                    };

                }
            )
        );


    /*
       CREATE BUTTONS
    */

    answers.forEach(
        function(item,index) {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.innerText =
                String.fromCharCode(
                    65 + index
                ) +
                ". " +
                item.text;


            /*
               CORRECT ANSWER
            */

            button.dataset.correct =
                (
                    item.originalIndex ===
                    question[2]
                );


            /*
               CLICK
            */

            button.onclick =
                function() {

                    checkAnswer(
                        button
                    );

                };


            answersDiv.appendChild(
                button
            );

        }
    );


    /*
       NEXT BUTTON
    */

    if (
        currentQuestion ===
        total - 1
    ) {

        document.getElementById(
            "nextButton"
        ).innerText =
            "Finish Quiz ✓";

    }

    else {

        document.getElementById(
            "nextButton"
        ).innerText =
            "Next →";

    }

}



/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(button) {


    if (answered) {

        return;

    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    const isCorrect =
        button.dataset.correct ===
        "true";


    /*
       CORRECT
    */

    if (isCorrect) {

        button.classList.add(
            "correct"
        );

        button.innerText +=
            " ✓";

        score++;


        document.getElementById(
            "message"
        ).innerText =
            "✓ Correct Answer!";


        document.getElementById(
            "message"
        ).style.color =
            "#28a745";

    }


    /*
       WRONG
    */

    else {

        button.classList.add(
            "wrong"
        );

        button.innerText +=
            " ✗";


        /*
           SHOW CORRECT
        */

        buttons.forEach(
            function(btn) {

                if (
                    btn.dataset.correct ===
                    "true"
                ) {

                    btn.classList.add(
                        "correct"
                    );

                    btn.innerText +=
                        " ✓";

                }

            }
        );


        document.getElementById(
            "message"
        ).innerText =
            "✗ Wrong Answer!";


        document.getElementById(
            "message"
        ).style.color =
            "#dc3545";

    }

}



/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {


    /*
       ANSWER REQUIRED
    */

    if (!answered) {

        document.getElementById(
            "message"
        ).innerText =
            "Please choose an answer first.";


        document.getElementById(
            "message"
        ).style.color =
            "#dc3545";


        return;

    }


    /*
       MOVE
    */

    currentQuestion++;


    /*
       MORE QUESTIONS
    */

    if (
        currentQuestion <
        quizQuestions.length
    ) {

        loadQuestion();

    }


    /*
       FINISH
    */

    else {

        finishQuiz();

    }

}



/* =====================================================
   TIMER
===================================================== */

function startTimer() {


    /*
       CLEAR OLD TIMER
    */

    clearInterval(
        timer
    );


    /*
       RESET TIME
    */

    timeLeft =
        QUIZ_TIME;


    updateTimerDisplay();


    /*
       COUNTDOWN
    */

    timer =
        setInterval(
            function() {

                timeLeft--;

                updateTimerDisplay();


                /*
                   TIME OVER
                */

                if (
                    timeLeft <= 0
                ) {

                    clearInterval(
                        timer
                    );

                    finishQuiz();

                }

            },
            1000
        );

}



/* =====================================================
   TIMER DISPLAY
===================================================== */

function updateTimerDisplay() {


    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    const formattedSeconds =
        String(
            seconds
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "timer"
    ).innerText =
        "⏱️ " +
        minutes +
        ":" +
        formattedSeconds;

}



/* =====================================================
   FINISH QUIZ
===================================================== */

function finishQuiz() {


    /*
       PREVENT DOUBLE FINISH
    */

    if (quizFinished) {

        return;

    }


    quizFinished = true;


    clearInterval(
        timer
    );


    /*
       TOTAL QUESTIONS
    */

    const total =
        quizQuestions.length;


    /*
       CALCULATE %
    */

    const percentage =
        Math.round(
            (
                score /
                total
            ) * 100
        );


    /*
       HIDE QUIZ
    */

    document.getElementById(
        "quizBox"
    ).style.display =
        "none";


    /*
       SHOW RESULT
    */

    document.getElementById(
        "resultBox"
    ).style.display =
        "block";


    /*
       SCORE
    */

    document.getElementById(
        "score"
    ).innerText =
        score +
        " / " +
        total;


    /*
       PERCENTAGE
    */

    document.getElementById(
        "percentage"
    ).innerText =
        percentage +
        "%";


    /*
       SAVE BEST SCORE
    */

    const bestKey =
        "level" +
        currentLevel +
        "Best";


    const oldBest =
        Number(
            localStorage.getItem(
                bestKey
            )
        ) || 0;


    if (
        percentage >
        oldBest
    ) {

        localStorage.setItem(
            bestKey,
            percentage
        );

    }


    /*
       =========================
       PASS
       =========================
    */

    if (
        percentage >= PASS_MARK
    ) {


        document.getElementById(
            "status"
        ).innerText =
            "🎉 PASS";


        document.getElementById(
            "status"
        ).style.color =
            "#28a745";


        document.getElementById(
            "resultTitle"
        ).innerText =
            "🏆 Excellent!";


        /*
           LEVEL 1–49
        */

        if (
            currentLevel <
            TOTAL_LEVELS
        ) {


            /*
               CURRENT UNLOCKED LEVEL
            */

            const currentUnlocked =
                Number(
                    localStorage.getItem(
                        "unlockedLevel"
                    )
                ) || 1;


            /*
               UNLOCK NEXT LEVEL
            */

            if (
                currentLevel + 1 >
                currentUnlocked
            ) {

                localStorage.setItem(
                    "unlockedLevel",
                    currentLevel + 1
                );

            }


            /*
               RESULT MESSAGE
            */

            document.getElementById(
                "resultMessage"
            ).innerText =
                "You scored " +
                percentage +
                "% and passed Level " +
                currentLevel +
                "!\n\n" +
                "🔓 Level " +
                (currentLevel + 1) +
                " is now unlocked.";


            /*
               SHOW NEXT BUTTON
            */

            document.getElementById(
                "nextLevelButton"
            ).style.display =
                "inline-block";

        }


        /*
           LEVEL 50 COMPLETE
        */

        else {


            document.getElementById(
                "resultMessage"
            ).innerText =
                "🏆 Congratulations!\n\n" +
                "You scored " +
                percentage +
                "% and successfully " +
                "completed all 50 levels!";


            document.getElementById(
                "nextLevelButton"
            ).style.display =
                "none";

        }

    }


    /*
       =========================
       FAIL
       =========================
    */

    else {


        document.getElementById(
            "status"
        ).innerText =
            "❌ FAIL";


        document.getElementById(
            "status"
        ).style.color =
            "#dc3545";


        document.getElementById(
            "resultTitle"
        ).innerText =
            "Keep Practicing!";


        document.getElementById(
            "resultMessage"
        ).innerText =
            "You scored " +
            percentage +
            "%.\n\n" +
            "You need at least " +
            PASS_MARK +
            "% to unlock the next level.\n\n" +
            "Please try again.";


        /*
           HIDE NEXT LEVEL
        */

        document.getElementById(
            "nextLevelButton"
        ).style.display =
            "none";

    }

}



/* =====================================================
   TRY AGAIN
===================================================== */

function restartQuiz() {

    createQuiz();

}



/* =====================================================
   NEXT LEVEL
===================================================== */

function goNextLevel() {


    if (
        currentLevel <
        TOTAL_LEVELS
    ) {

        const nextLevel =
            currentLevel + 1;


        /*
           DOUBLE CHECK UNLOCK
        */

        const unlockedLevel =
            Number(
                localStorage.getItem(
                    "unlockedLevel"
                )
            ) || 1;


        if (
            nextLevel <=
            unlockedLevel
        ) {

            window.location.href =
                "quiz.html?level=" +
                nextLevel;

        }

    }

}



/* =====================================================
   HOME
===================================================== */

function goHome() {

    clearInterval(
        timer
    );

    window.location.href =
        "index.html";

}



/* =====================================================
   START
===================================================== */

createQuiz();

</script>

</body>

</html>
