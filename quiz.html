<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =========================
   BODY
========================= */

body {

    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    display: flex;

    justify-content: center;

    align-items: center;

/* =========================

}

}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .quiz-box {

        padding: 25px;

    }


    .top {

        align-items: flex-start;

    }


    .level-title {

        font-size: 17px;

    }


    .question {

        font-size: 21px;

        font-size: 16px;

    }

        font-size: 17px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     QUIZ BOX
===================================================== -->

<div class="quiz-box" id="quizBox">


    <div class="top">

        <div class="level-title"
             id="levelTitle">

            Level 1

        </div>


        <div class="timer"
             id="timer">

            ⏱️ 10:00

        </div>

    </div>


    <div class="progress-text"
         id="progressText">

        Question 1 / 50

    </div>


    <div class="progress-container">

        <div class="progress-bar"
             id="progressBar">
        </div>

    </div>


    <div class="question"
         id="question">
    </div>


    <div id="answers">
    </div>


    <div class="message"
         id="message">
    </div>


    <button class="next"
            id="nextButton"
            onclick="nextQuestion()">

        Next →

    </button>

</div>



<!-- =====================================================
     RESULT BOX
===================================================== -->

<div class="quiz-box result"
     id="resultBox">


    <h1 id="resultTitle">

        🎉 Quiz Completed!

    </h1>


    <p>Your Score</p>


    <div class="score"
         id="score">

        0 / 50

    </div>


    <div class="percentage"
         id="percentage">

        0%

    </div>


    <div class="status"
         id="status">

        Completed

    </div>


    <div class="result-message"
         id="resultMessage">
    </div>


    <button class="restart"
            onclick="restartQuiz()">

        🔄 Try Again

    </button>


    <button class="next-level"
            id="nextLevelButton"
            onclick="goNextLevel()">

        ➡️ Next Level

    </button>


    <button class="home"
            onclick="goHome()">

        🏠 Home

    </button>

</div>



<!-- =====================================================
     QUESTION BANK
===================================================== -->

<script src="questions.js?v=4"></script>


<script>


/* =====================================================
   QUIZ SETTINGS
===================================================== */


/*
   ONLY LEVEL 1–20
*/

const TOTAL_LEVELS = 20;


/*
   EVERY LEVEL = 50 QUESTIONS
*/

const QUESTIONS_PER_LEVEL = 50;


/*
   NO PASS MARK

   Users can complete every level
   regardless of their score.
*/


/*
   50 QUESTIONS
   10 MINUTES
*/

const QUIZ_TIME = 600;



/* =====================================================
   VARIABLES
===================================================== */

let currentLevel = 1;

let quizQuestions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;

let timeLeft = QUIZ_TIME;

let timer = null;

let quizFinished = false;



/* =====================================================
   LEVEL TITLES
===================================================== */

const levelTitles = {

    1:
        "Gemini Class Level 1 - ASEAN",

    2:
        "Gemini Class Level 2 - United Nations",

    3:
        "Gemini Class Level 3 - MOFA ငယ်/ရေး Objectives Chapter 1",

    4:
        "Gemini Class Level 4 - MOFA ငယ်/ရေး Objectives Chapter 2",

    5:
        "Gemini Class Level 5 - MOFA ငယ်/ရေး Objectives Chapter 3",

    6:
        "Gemini Class Level 6 - MOFA ငယ်/ရေး Objectives Chapter 4",

    7:
        "Gemini Class Level 7 - MOFA ငယ်/ရေး Objectives Chapter 5",

    8:
        "Gemini Class Level 8 - MOFA ငယ်/ရေး Objectives Chapter 6",

    9:
        "Gemini Class Level 9 - MOFA ငယ်/ရေး Objectives Chapter 7",

    10:
        "Gemini Class Level 10 - MOFA ငယ်/ရေး Objectives Chapter 8",

    11:
        "Gemini Class Level 11 - MOFA ငယ်/ရေး Objectives Chapter 9",

    12:
        "Gemini Class Level 12 - MOFA ငယ်/ရေး Objectives Chapter 10",

    13:
        "Gemini Class Level 13 - MOFA ငယ်/ရေး English Chapter 1",

    14:
        "Gemini Class Level 14 - MOFA ငယ်/ရေး English Chapter 2",

    15:
        "Gemini Class Level 15 - MOFA ငယ်/ရေး English Chapter 3",

    16:
        "Gemini Class Level 16 - MOFA ငယ်/ရေး English Chapter 4",

    17:
        "Gemini Class Level 17 - MOFA ငယ်/ရေး English Chapter 5",

    18:
        "Gemini Class Level 18 - MOFA ငယ်/ရေး English Chapter 6",

    19:
        "Gemini Class Level 19 - MOFA ငယ်/ရေး English Chapter 7",

    20:
        "Gemini Class Level 20 - MOFA ငယ်/ရေး English Chapter 8"

};



/* =====================================================
   GET LEVEL FROM URL
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


if (urlParams.has("level")) {

    currentLevel =
        Number(
            urlParams.get("level")
        );

}



/* =====================================================
   CHECK VALID LEVEL
===================================================== */

if (

    !Number.isInteger(currentLevel) ||

    currentLevel < 1 ||

    currentLevel > TOTAL_LEVELS

) {

    alert(
        "Invalid quiz level."
    );

    window.location.href =
        "index.html";

}


/* =====================================================
   NO LOGIN CHECK
   NO APPROVAL CHECK
   NO UNLOCK CHECK

   ALL LEVELS 1–20 ARE PUBLIC.
===================================================== */



/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    return array

        .map(
            function(value) {

                return {

                    value: value,

                    sort: Math.random()

                };

            }
        )

        .sort(
            function(a,b) {

                return a.sort - b.sort;

            }
        )

        .map(
            function(item) {

                return item.value;

            }
        );

}



/* =====================================================
   CREATE QUIZ
===================================================== */

function createQuiz() {


    quizFinished = false;


    /* GET CURRENT LEVEL BANK */

    const bank =
        questionBank[currentLevel];


    /* CHECK QUESTION BANK */

    if (
        !Array.isArray(bank)
    ) {

        alert(
            "Question bank not found for Level " +
            currentLevel +
            "."
        );

        window.location.href =
            "index.html";

        return;

    }


    /* EVERY LEVEL MUST HAVE 50 QUESTIONS */

    if (
        bank.length < QUESTIONS_PER_LEVEL
    ) {

        alert(

            "Level " +
            currentLevel +
            " needs 50 questions.\n\n" +

            "Current questions found: " +
            bank.length

        );

        window.location.href =
            "index.html";

        return;

    }


    /*
       USE FIRST 50 QUESTIONS
       IN RANDOM ORDER
    */

    quizQuestions =
        shuffle(
            [...bank]
        ).slice(
            0,
            QUESTIONS_PER_LEVEL
        );


    /* RESET */

    currentQuestion = 0;

    score = 0;

    answered = false;

    timeLeft = QUIZ_TIME;


    /* RESET RESULT */

    document.getElementById(
        "resultBox"
    ).style.display =
        "none";


    document.getElementById(
        "quizBox"
    ).style.display =
        "block";


    /* SHOW QUIZ */

    loadQuestion();


    /* START TIMER */

    startTimer();

}



/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

    answered = false;


    const question =
        quizQuestions[
            currentQuestion
        ];


    const total =
        quizQuestions.length;


    /* LEVEL TITLE */

    document.getElementById(
        "levelTitle"
    ).innerText =
        levelTitles[currentLevel] ||
        "Gemini Class Level " +
        currentLevel;


    /* QUESTION NUMBER */

    document.getElementById(
        "progressText"
    ).innerText =

        "Question " +

        (currentQuestion + 1) +

        " / " +

        total;


    /* QUESTION TEXT */

    document.getElementById(
        "question"
    ).innerText =
        question[0];


    /* PROGRESS */

    const progress =
        (
            (currentQuestion + 1)
            /
            total
        ) * 100;


    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";


    /* CLEAR MESSAGE */

    document.getElementById(
        "message"
    ).innerText = "";


    /* CLEAR ANSWERS */

    const answersDiv =
        document.getElementById(
            "answers"
        );


    answersDiv.innerHTML = "";


    /* SHUFFLE ANSWERS */

    const answers =
        shuffle(
            question[1].map(
                function(answer,index) {

                    return {

                        text: answer,

                        originalIndex:
                            index

                    };

                }
            )
        );


    /* CREATE ANSWER BUTTONS */

    answers.forEach(
        function(item,index) {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.innerText =

                String.fromCharCode(
                    65 + index
                ) +

                ". " +

                item.text;


            /* CORRECT ANSWER */

            button.dataset.correct =

                (
                    item.originalIndex ===
                    question[2]
                );


            /* CLICK */

            button.onclick =
                function() {

                    checkAnswer(
                        button
                    );

                };


            answersDiv.appendChild(
                button
            );

        }
    );


    /* NEXT BUTTON */

    if (
        currentQuestion ===
        total - 1
    ) {

        document.getElementById(
            "nextButton"
        ).innerText =
            "Finish Quiz ✓";

    }

    else {

        document.getElementById(
            "nextButton"
        ).innerText =
            "Next →";

    }

}



/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(button) {


    if (answered) {

        return;

    }


    answered = true;


    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    const isCorrect =
        button.dataset.correct ===
        "true";


    /* CORRECT */

    if (isCorrect) {

        button.classList.add(
            "correct"
        );


        button.innerText +=
            " ✓";


        score++;


        document.getElementById(
            "message"
        ).innerText =
            "✓ Correct Answer!";


        document.getElementById(
            "message"
        ).style.color =
            "#28a745";

    }


    /* WRONG */

    else {

        button.classList.add(
            "wrong"
        );


        button.innerText +=
            " ✗";


        /* SHOW CORRECT ANSWER */

        buttons.forEach(
            function(btn) {

                if (
                    btn.dataset.correct ===
                    "true"
                ) {

                    btn.classList.add(
                        "correct"
                    );

                    btn.innerText +=
                        " ✓";

                }

            }
        );


        document.getElementById(
            "message"
        ).innerText =
            "✗ Wrong Answer!";


        document.getElementById(
            "message"
        ).style.color =
            "#dc3545";

    }

}



/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {


    /* ANSWER REQUIRED */

    if (!answered) {

        document.getElementById(
            "message"
        ).innerText =
            "Please choose an answer first.";


        document.getElementById(
            "message"
        ).style.color =
            "#dc3545";


        return;

    }


    currentQuestion++;


    /* MORE QUESTIONS */

    if (
        currentQuestion <
        quizQuestions.length
    ) {

        loadQuestion();

    }


    /* FINISH */

    else {

        finishQuiz();

    }

}



/* =====================================================
   TIMER
===================================================== */

function startTimer() {


    clearInterval(
        timer
    );


    timeLeft =
        QUIZ_TIME;


    updateTimerDisplay();


    timer =
        setInterval(
            function() {

                timeLeft--;

                updateTimerDisplay();


                /* TIME OVER */

                if (
                    timeLeft <= 0
                ) {

                    clearInterval(
                        timer
                    );

                    finishQuiz();

                }

            },
            1000
        );

}



/* =====================================================
   TIMER DISPLAY
===================================================== */

function updateTimerDisplay() {


    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    const formattedSeconds =
        String(
            seconds
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "timer"
    ).innerText =

        "⏱️ " +

        minutes +

        ":" +

        formattedSeconds;

}



/* =====================================================
   FINISH QUIZ
===================================================== */

function finishQuiz() {


    /* PREVENT DOUBLE FINISH */

    if (quizFinished) {

        return;

    }


    quizFinished = true;


    clearInterval(
        timer
    );


    /* TOTAL QUESTIONS */

    const total =
        quizQuestions.length;


    /* CALCULATE PERCENTAGE */

    const percentage =
        Math.round(
            (
                score /
                total
            ) * 100
        );


    /* HIDE QUIZ */

    document.getElementById(
        "quizBox"
    ).style.display =
        "none";


    /* SHOW RESULT */

    document.getElementById(
        "resultBox"
    ).style.display =
        "block";


    /* SCORE */

    document.getElementById(
        "score"
    ).innerText =

        score +
        " / " +
        total;


    /* PERCENTAGE */

    document.getElementById(
        "percentage"
    ).innerText =

        percentage +
        "%";


    /* STATUS */

    document.getElementById(
        "status"
    ).innerText =
        "Completed";


    document.getElementById(
        "status"
    ).style.color =
        "#667eea";


    /* TITLE */

    document.getElementById(
        "resultTitle"
    ).innerText =
        "🎉 Quiz Completed!";


    /* RESULT MESSAGE */

    document.getElementById(
        "resultMessage"
    ).innerText =

        "You scored " +

        percentage +

        "% in " +

        levelTitles[currentLevel] +

        ".\n\n" +

        "There is no pass mark or level unlock requirement.\n" +

        "You can try again or continue to the next level.";


    /* NEXT LEVEL BUTTON */

    const nextButton =
        document.getElementById(
            "nextLevelButton"
        );


    if (
        currentLevel <
        TOTAL_LEVELS
    ) {

        nextButton.style.display =
            "inline-block";

        nextButton.innerText =

            "➡️ Next Level " +
            (currentLevel + 1);

    }

    else {

        nextButton.style.display =
            "none";

    }

}



/* =====================================================
   TRY AGAIN
===================================================== */

function restartQuiz() {

    createQuiz();

}



/* =====================================================
   NEXT LEVEL
===================================================== */

function goNextLevel() {


    if (
        currentLevel <
        TOTAL_LEVELS
    ) {

        const nextLevel =
            currentLevel + 1;


        /*
           NO UNLOCK CHECK
           NO PASS CHECK
           DIRECT ACCESS
        */

        window.location.href =

            "quiz.html?level=" +

            nextLevel;

    }

}



/* =====================================================
   HOME
===================================================== */

function goHome() {

    clearInterval(
        timer
    );


    window.location.href =
        "index.html";

}



/* =====================================================
   START
===================================================== */

createQuiz();

</script>

</body>

</html>
