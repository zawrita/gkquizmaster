<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>GK Quiz Master</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =========================
   BODY
========================= */

body {

    margin: 0;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;
}


/* =========================
   QUIZ BOX
========================= */

.quiz-box {

    width: 100%;

    max-width: 720px;

    background: white;

    padding: 35px;

    border-radius: 22px;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,0.2);
}


/* =========================
   TOP
========================= */

.top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 15px;
}


.level-title {

    font-size: 20px;

    font-weight: bold;

    color: #667eea;
}


.timer {

    font-size: 20px;

    font-weight: bold;
}


/* =========================
   PROGRESS
========================= */

.progress-text {

    color: #777;

    margin-bottom: 8px;

    font-size: 16px;
}


.progress-container {

    width: 100%;

    height: 10px;

    background: #eee;

    border-radius: 10px;

    margin-bottom: 25px;

    overflow: hidden;
}


.progress-bar {

    width: 0%;

    height: 100%;

    background: #667eea;

    border-radius: 10px;

    transition: width 0.3s;
}


/* =========================
   QUESTION
========================= */

.question {

    font-size: 25px;

    font-weight: bold;

    line-height: 1.5;

    margin-bottom: 25px;
}


/* =========================
   ANSWERS
========================= */

.answer {

    width: 100%;

    padding: 16px;

    margin: 8px 0;

    border: 2px solid #ddd;

    background: white;

    border-radius: 12px;

    text-align: left;

    font-size: 17px;

    cursor: pointer;

    transition: 0.2s;
}


.answer:hover {

    background: #f1f2ff;

    border-color: #667eea;
}


.answer.correct {

    background: #d4edda !important;

    border-color: #28a745 !important;

    color: #155724;
}


.answer.wrong {

    background: #f8d7da !important;

    border-color: #dc3545 !important;

    color: #721c24;
}


/* =========================
   MESSAGE
========================= */

.message {

    text-align: center;

    font-size: 19px;

    font-weight: bold;

    min-height: 25px;

    margin-top: 15px;
}


/* =========================
   NEXT BUTTON
========================= */

.next {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: none;

    border-radius: 12px;

    background: #667eea;

    color: white;

    font-size: 18px;

    cursor: pointer;
}


.next:hover {

    background: #5568d9;
}


/* =========================
   RESULT
========================= */

.result {

    display: none;

    text-align: center;
}


.result h1 {

    font-size: 32px;
}


.score {

    font-size: 55px;

    font-weight: bold;

    color: #667eea;

    margin: 20px;
}


.percentage {

    font-size: 25px;

    margin-bottom: 10px;
}


.status {

    font-size: 23px;

    font-weight: bold;

    margin-bottom: 20px;
}


.result-message {

    font-size: 18px;

    line-height: 1.5;

    margin-bottom: 20px;

    white-space: pre-line;
}


/* =========================
   RESULT BUTTONS
========================= */

.restart,
.home,
.next-level {

    padding: 14px 25px;

    border: none;

    border-radius: 10px;

    color: white;

    font-size: 16px;

    cursor: pointer;

    margin: 5px;
}


.restart {

    background: #667eea;
}


.home {

    background: #555;
}


.next-level {

    background: #28a745;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .quiz-box {

        padding: 25px;
    }


    .question {

        font-size: 21px;
    }


    .answer {

        font-size: 16px;

        padding: 14px;
    }


    .timer {

        font-size: 17px;
    }

}

</style>

</head>

<body>

<!-- =====================================================
     QUIZ BOX
===================================================== -->

<div class="quiz-box" id="quizBox">

```
<div class="top">


    <div class="level-title"
         id="levelTitle">

        Level 1

    </div>


    <div class="timer"
         id="timer">

        ⏱️ 10:00

    </div>


</div>


<div class="progress-text"
     id="progressText">

    Question 1 / 50

</div>


<div class="progress-container">

    <div class="progress-bar"
         id="progressBar">

    </div>

</div>


<div class="question"
     id="question">

</div>


<div id="answers">

</div>


<div class="message"
     id="message">

</div>


<button class="next"
        id="nextButton"
        onclick="nextQuestion()">

    Next →

</button>
```

</div>

<!-- =====================================================
     RESULT BOX
===================================================== -->

<div class="quiz-box result"
     id="resultBox">

```
<h1 id="resultTitle">

    🎉 Quiz Completed!

</h1>


<p>Your Score</p>


<div class="score"
     id="score">

    0 / 50

</div>


<div class="percentage"
     id="percentage">

    0%

</div>


<div class="status"
     id="status">

</div>


<div class="result-message"
     id="resultMessage">

</div>


<button class="restart"
        onclick="restartQuiz()">

    🔄 Try Again

</button>


<button class="next-level"
        id="nextLevelButton"
        onclick="goNextLevel()"
        style="display:none;">

    🔓 Next Level

</button>


<button class="home"
        onclick="goHome()">

    🏠 Home

</button>
```

</div>

<!-- =====================================================
     QUESTION BANK
===================================================== -->

<!--
     IMPORTANT:
     questions.js contains your ASEAN 50 questions
-->

<script src="questions.js?v=2"></script>

<script>

/* =====================================================
   QUIZ SETTINGS
===================================================== */


/*
   LEVEL 1
   -------------------------
   50 QUESTIONS
   10 MINUTES
   600 SECONDS
*/


const LEVEL_1_QUESTIONS = 50;

const LEVEL_1_TIME = 600;


/*
   LEVEL 2 - 5
   -------------------------
   10 QUESTIONS
   60 SECONDS
*/


const OTHER_LEVEL_QUESTIONS = 10;

const OTHER_LEVEL_TIME = 60;


/*
   PASS MARK
*/


const PASS_MARK = 90;



/* =====================================================
   VARIABLES
===================================================== */

let currentLevel = 1;

let quizQuestions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;

let timeLeft = 0;

let timer = null;



/* =====================================================
   GET LEVEL FROM URL
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


if (urlParams.has("level")) {

    currentLevel =
        Number(
            urlParams.get("level")
        );

}


/* =====================================================
   CHECK VALID LEVEL
===================================================== */

if (
    !Number.isInteger(currentLevel) ||
    currentLevel < 1 ||
    currentLevel > 5
) {

    alert("Invalid quiz level.");

    window.location.href =
        "index.html";

}



/* =====================================================
   CHECK LEVEL PERMISSION
===================================================== */

function checkLevelPermission() {


    /*
       LEVEL 1 & 2
       PUBLIC
    */

    if (
        currentLevel === 1 ||
        currentLevel === 2
    ) {

        return true;

    }


    /*
       LEVEL 3 - 5
       LOGIN REQUIRED
    */

    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        );


    if (!currentUser) {

        alert(
            "🔐 Please login first.\n\n" +
            "Levels 3, 4 and 5 require " +
            "an Admin-approved account."
        );

        window.location.href =
            "login.html";

        return false;

    }


    /*
       GET USERS
    */

    const users =
        JSON.parse(
            localStorage.getItem(
                "users"
            )
        ) || [];


    /*
       FIND USER
    */

    const user =
        users.find(
            function(u) {

                return (
                    u.email ===
                    currentUser.email
                );

            }
        );


    if (!user) {

        localStorage.removeItem(
            "currentUser"
        );

        alert(
            "Your account could not be found."
        );

        window.location.href =
            "login.html";

        return false;

    }


    /*
       ADMIN APPROVAL
    */

    if (
        user.approved !== true
    ) {

        alert(
            "⏳ Your account is not approved yet.\n\n" +
            "Please wait for Admin approval."
        );

        window.location.href =
            "index.html";

        return false;

    }


    return true;

}



/* =====================================================
   RUN PERMISSION CHECK
===================================================== */

if (
    !checkLevelPermission()
) {

    throw new Error(
        "Access denied."
    );

}



/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    return array
        .map(
            function(value) {

                return {

                    value: value,

                    sort: Math.random()

                };

            }
        )
        .sort(
            function(a,b) {

                return a.sort - b.sort;

            }
        )
        .map(
            function(item) {

                return item.value;

            }
        );

}



/* =====================================================
   CREATE QUIZ
===================================================== */

function createQuiz() {


    /*
       GET BANK
    */

    const bank =
        questionBank[currentLevel];


    /*
       QUESTION BANK NOT FOUND
    */

    if (
        !Array.isArray(bank)
    ) {

        alert(
            "Question bank not found for Level " +
            currentLevel
        );

        window.location.href =
            "index.html";

        return;

    }


    /*
       DETERMINE NUMBER OF QUESTIONS
    */


    let questionsToUse;

    let quizTime;


    /*
       =========================
       LEVEL 1
       =========================

       ALWAYS USE ALL 50
    */

    if (
        currentLevel === 1
    ) {

        questionsToUse =
            50;

        quizTime =
            600;

    }


    /*
       =========================
       LEVEL 2 - 5
       =========================
    */

    else {

        questionsToUse =
            10;

        quizTime =
            60;

    }


    /*
       IMPORTANT CHECK
    */

    if (
        currentLevel === 1 &&
        bank.length < 50
    ) {

        alert(
            "Level 1 needs 50 questions.\n\n" +
            "Current questions found: " +
            bank.length
        );

        return;

    }


    /*
       LEVEL 1
       -------------------------
       DO NOT RANDOMLY REMOVE
       QUESTIONS.

       Use all 50 questions.
    */

    if (
        currentLevel === 1
    ) {

        quizQuestions =
            [...bank];

    }


    /*
       LEVEL 2 - 5
       -------------------------
       Randomly select 10.
    */

    else {

        quizQuestions =
            shuffle(
                [...bank]
            ).slice(
                0,
                Math.min(
                    questionsToUse,
                    bank.length
                )
            );

    }


    /*
       RESET QUIZ
    */

    currentQuestion = 0;

    score = 0;

    answered = false;


    /*
       UPDATE TIMER SETTING
    */

    timeLeft =
        quizTime;


    /*
       SHOW QUIZ
    */

    document.getElementById(
        "quizBox"
    ).style.display =
        "block";


    document.getElementById(
        "resultBox"
    ).style.display =
        "none";


    /*
       LOAD FIRST QUESTION
    */

    loadQuestion();


    /*
       START TIMER
    */

    startTimer();

}



/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {


    answered = false;


    /*
       GET QUESTION
    */

    const question =
        quizQuestions[
            currentQuestion
        ];


    /*
       TOTAL
    */

    const total =
        quizQuestions.length;


    /*
       LEVEL TITLE
    */

    document.getElementById(
        "levelTitle"
    ).innerText =
        "Level " +
        currentLevel;


    /*
       QUESTION NUMBER
    */

    document.getElementById(
        "progressText"
    ).innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        total;


    /*
       QUESTION TEXT
    */

    document.getElementById(
        "question"
    ).innerText =
        question[0];


    /*
       PROGRESS BAR
    */

    const progress =
        (
            (currentQuestion + 1)
            /
            total
        ) * 100;


    document.getElementById(
        "progressBar"
    ).style.width =
        progress + "%";


    /*
       CLEAR MESSAGE
    */

    document.getElementById(
        "message"
    ).innerText = "";


    /*
       CLEAR ANSWERS
    */

    const answersDiv =
        document.getElementById(
            "answers"
        );


    answersDiv.innerHTML = "";


    /*
       SHUFFLE ANSWERS

       IMPORTANT:
       Original answer index
       remains unchanged.
    */

    const answers =
        shuffle(
            question[1].map(
                function(answer,index) {

                    return {

                        text: answer,

                        originalIndex:
                            index

                    };

                }
            )
        );


    /*
       CREATE ANSWER BUTTONS
    */

    answers.forEach(
        function(item,index) {


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "answer";


            button.innerText =
                String.fromCharCode(
                    65 + index
                ) +
                ". " +
                item.text;


            /*
               TRUE = CORRECT
            */

            button.dataset.correct =
                (
                    item.originalIndex ===
                    question[2]
                );


            /*
               CLICK
            */

            button.onclick =
                function() {

                    checkAnswer(
                        button
                    );

                };


            answersDiv.appendChild(
                button
            );

        }
    );


    /*
       NEXT BUTTON TEXT
    */

    if (
        currentQuestion ===
        total - 1
    ) {

        document.getElementById(
            "nextButton"
        ).innerText =
            "Finish Quiz ✓";

    }

    else {

        document.getElementById(
            "nextButton"
        ).innerText =
            "Next →";

    }

}



/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer(button) {


    /*
       ALREADY ANSWERED
    */

    if (answered) {

        return;

    }


    answered = true;


    /*
       ALL ANSWERS
    */

    const buttons =
        document.querySelectorAll(
            ".answer"
        );


    /*
       CHECK
    */

    const isCorrect =
        button.dataset.correct ===
        "true";


    /*
       CORRECT
    */

    if (isCorrect) {


        button.classList.add(
            "correct"
        );


        button.innerText +=
            " ✓";


        score++;


        document.getElementById(
            "message"
        ).innerText =
            "✓ Correct Answer!";


        document.getElementById(
            "message"
        ).style.color =
            "#28a745";

    }


    /*
       WRONG
    */

    else {


        button.classList.add(
            "wrong"
        );


        button.innerText +=
            " ✗";


        /*
           SHOW CORRECT ANSWER
        */

        buttons.forEach(
            function(btn) {

                if (
                    btn.dataset.correct ===
                    "true"
                ) {

                    btn.classList.add(
                        "correct"
                    );

                    btn.innerText +=
                        " ✓";

                }

            }
        );


        document.getElementById(
            "message"
        ).innerText =
            "✗ Wrong Answer!";


        document.getElementById(
            "message"
        ).style.color =
            "#dc3545";

    }

}



/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {


    /*
       ANSWER REQUIRED
    */

    if (!answered) {

        document.getElementById(
            "message"
        ).innerText =
            "Please choose an answer first.";


        document.getElementById(
            "message"
        ).style.color =
            "#dc3545";


        return;

    }


    /*
       MOVE TO NEXT
    */

    currentQuestion++;


    /*
       MORE QUESTIONS
    */

    if (
        currentQuestion <
        quizQuestions.length
    ) {

        loadQuestion();

    }


    /*
       FINISH
    */

    else {

        finishQuiz();

    }

}



/* =====================================================
   TIMER
===================================================== */

function startTimer() {


    /*
       STOP OLD TIMER
    */

    clearInterval(
        timer
    );


    /*
       SET TIME
    */

    if (
        currentLevel === 1
    ) {

        timeLeft =
            600;

    }

    else {

        timeLeft =
            60;

    }


    /*
       DISPLAY
    */

    updateTimerDisplay();


    /*
       COUNTDOWN
    */

    timer =
        setInterval(
            function() {


                timeLeft--;


                updateTimerDisplay();


                /*
                   TIME OVER
                */

                if (
                    timeLeft <= 0
                ) {

                    clearInterval(
                        timer
                    );

                    finishQuiz();

                }

            },
            1000
        );

}



/* =====================================================
   TIMER DISPLAY
===================================================== */

function updateTimerDisplay() {


    const minutes =
        Math.floor(
            timeLeft / 60
        );


    const seconds =
        timeLeft % 60;


    const formattedSeconds =
        String(
            seconds
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "timer"
    ).innerText =
        "⏱️ " +
        minutes +
        ":" +
        formattedSeconds;

}



/* =====================================================
   FINISH QUIZ
===================================================== */

function finishQuiz() {


    /*
       PREVENT DOUBLE FINISH
    */

    clearInterval(
        timer
    );


    /*
       TOTAL
    */

    const total =
        quizQuestions.length;


    /*
       PERCENTAGE
    */

    const percentage =
        Math.round(
            (
                score /
                total
            ) * 100
        );


    /*
       HIDE QUIZ
    */

    document.getElementById(
        "quizBox"
    ).style.display =
        "none";


    /*
       SHOW RESULT
    */

    document.getElementById(
        "resultBox"
    ).style.display =
        "block";


    /*
       SCORE
    */

    document.getElementById(
        "score"
    ).innerText =
        score +
        " / " +
        total;


    /*
       PERCENTAGE
    */

    document.getElementById(
        "percentage"
    ).innerText =
        percentage +
        "%";


    /*
       SAVE BEST SCORE
    */

    const bestKey =
        "level" +
        currentLevel +
        "Best";


    const oldBest =
        Number(
            localStorage.getItem(
                bestKey
            )
        ) || 0;


    if (
        percentage >
        oldBest
    ) {

        localStorage.setItem(
            bestKey,
            percentage
        );

    }


    /*
       PASS
    */

    if (
        percentage >=
        PASS_MARK
    ) {


        document.getElementById(
            "status"
        ).innerText =
            "🎉 PASS";


        document.getElementById(
            "status"
        ).style.color =
            "#28a745";


        document.getElementById(
            "resultTitle"
        ).innerText =
            "🏆 Excellent!";


        document.getElementById(
            "resultMessage"
        ).innerText =
            "You scored " +
            percentage +
            "% and passed Level " +
            currentLevel +
            "!";


        /*
           UNLOCK NEXT LEVEL
        */

        const currentUnlocked =
            Number(
                localStorage.getItem(
                    "unlockedLevel"
                )
            ) || 1;


        if (
            currentLevel < 5 &&
            currentLevel + 1 >
            currentUnlocked
        ) {

            localStorage.setItem(
                "unlockedLevel",
                currentLevel + 1
            );

        }


        /*
           NEXT LEVEL BUTTON
        */

        if (
            currentLevel < 5
        ) {

            document.getElementById(
                "nextLevelButton"
            ).style.display =
                "inline-block";

        }


        else {

            document.getElementById(
                "resultMessage"
            ).innerText =
                "🏆 Congratulations! " +
                "You completed all 5 levels!";

        }

    }


    /*
       FAIL
    */

    else {


        document.getElementById(
            "status"
        ).innerText =
            "❌ FAIL";


        document.getElementById(
            "status"
        ).style.color =
            "#dc3545";


        document.getElementById(
            "resultTitle"
        ).innerText =
            "Keep Practicing!";


        document.getElementById(
            "resultMessage"
        ).innerText =
            "You need at least " +
            PASS_MARK +
            "% to pass this level.\n\n" +
            "Try again and improve your score!";


        document.getElementById(
            "nextLevelButton"
        ).style.display =
            "none";

    }

}



/* =====================================================
   TRY AGAIN
===================================================== */

function restartQuiz() {

    createQuiz();

}



/* =====================================================
   NEXT LEVEL
===================================================== */

function goNextLevel() {


    if (
        currentLevel < 5
    ) {

        window.location.href =
            "quiz.html?level=" +
            (
                currentLevel + 1
            );

    }

}



/* =====================================================
   HOME
===================================================== */

function goHome() {


    clearInterval(
        timer
    );


    window.location.href =
        "index.html";

}



/* =====================================================
   START
===================================================== */

createQuiz();

</script>

</body>
